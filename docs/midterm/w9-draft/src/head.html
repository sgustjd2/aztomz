<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<title>단테랩스 슬라이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ═══════════════════════════════════════════════════════════════
 * 단테랩스 디자인 시스템 v2 · Tokens (브랜드 2026-09)
 * 브랜드 결정: docs/color.md, docs/logo.md · v1은 github.com/dandacompany/dantelabs-design-system
 * ═══════════════════════════════════════════════════════════════ */

:root {
  /* ─── TIER 1 · Primitive Color Tokens ─────────────────────── */
  --color-cream: #f3eee2;
  --color-cream-soft: #e9e3d3;
  --color-cream-strong: #faf7ee;
  --color-navy: #09223f;
  --color-navy-soft: #1f3a5c;
  --color-gray: #3f4346;
  --color-gray-muted: #5f666d;
  --color-khaki: #5d6c58;
  --color-khaki-light: #a9b5a2;
  --color-blue: #2b6cb8;
  --color-blue-strong: #245c9e;
  --color-blue-light: #9cc0e6;
  --color-yellow: #ecc95f;
  --color-danger: #a63d33;

  --border: rgba(9, 34, 63, 0.12);
  --border-strong: rgba(9, 34, 63, 0.24);
  --border-on-dark: rgba(243, 238, 226, 0.24);

  /* ─── TIER 2 · Semantic Color Tokens ────────────────────────
   * 이름은 v1과 같다. v1 CSS를 쓰던 곳은 파일만 바꿔 끼우면 된다.
   * v2에서 추가: bg-inverse, bg-board, text-on-dark(-muted), accent-on-dark. */
  --bg-canvas: var(--color-cream);
  --bg-surface: var(--color-cream-strong);
  --bg-subtle: var(--color-cream-soft);
  --bg-inverse: var(--color-navy);
  --bg-board: var(--color-khaki);

  --text-primary: var(--color-navy);
  --text-secondary: var(--color-gray);
  --text-muted: var(--color-gray-muted);
  --text-link: var(--color-blue-strong);
  --text-meta: var(--color-gray-muted);
  --text-on-dark: var(--color-cream);
  --text-on-dark-muted: var(--color-khaki-light);

  --accent-brand: var(--color-blue);        /* 포인트 — 밝은 면에서만 */
  --accent-on-dark: var(--color-yellow);    /* 포인트 — 어두운 면(navy, khaki)에서만 */
  --accent-alt: var(--color-khaki);
  --highlight: var(--color-yellow);

  --state-info: var(--color-blue-strong);
  --state-success: var(--color-khaki);
  --state-warning: var(--color-yellow);
  --state-danger: var(--color-danger);

  /* ─── TIER 1 · Typography Primitives ──────────────────────── */
  --font-editorial-ko:
    "Nanum Myeongjo", "Noto Serif KR", "Times New Roman", serif;
  --font-editorial-en: "Playfair Display", "Times New Roman", serif;
  --font-heading: "Noto Serif KR", "Source Serif 4", Georgia, serif;
  --font-body: "Noto Serif KR", "Source Serif 4", Georgia, serif;
  --font-sans: "Pretendard", -apple-system, "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", Menlo, Consolas, monospace;
  --font-logo: "JetBrains Mono", Menlo, Consolas, monospace; /* 로고는 800, 자간 -0.04em */

  /* ─── Editorial Scale (5 levels · spec §3.2) ──────────────── */
  --type-hero: 800 128px/1.15 var(--font-editorial-ko);
  --type-display: 700 96px/1.1 var(--font-editorial-ko);
  --type-accent: 700 64px/1.2 var(--font-editorial-ko);
  --type-sub: 400 32px/1.4 var(--font-body);
  --type-meta: 500 18px/1.5 var(--font-sans);

  /* ─── UI Scale (9 levels · spec §3.3) ─────────────────────── */
  --type-h1: 700 56px/1.2 var(--font-heading);
  --type-h2: 700 40px/1.25 var(--font-heading);
  --type-h3: 600 28px/1.3 var(--font-heading);
  --type-h4: 600 22px/1.35 var(--font-heading);
  --type-body-lg: 400 20px/1.65 var(--font-body);
  --type-body: 400 16px/1.65 var(--font-body);
  --type-body-sm: 400 14px/1.5 var(--font-body);
  --type-caption: 500 13px/1.4 var(--font-sans);
  --type-button: 600 14px/1 var(--font-sans);

  /* ─── Spacing ─── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;
  --space-xs: var(--space-1);
  --space-sm: var(--space-2);
  --space-md: var(--space-4);
  --space-lg: var(--space-6);
  --space-xl: var(--space-8);

  /* ─── Radius ─── */
  --radius-none: 0;
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 8px;
  --radius-full: 9999px;

  /* ─── Shadow (editorial emboss · navy-tint) ─── */
  --shadow-none: none;
  --shadow-sm:
    0 0 0 1px rgba(9, 34, 63, 0.06), 0 1px 2px rgba(9, 34, 63, 0.04);
  --shadow-md:
    0 0 0 1px rgba(9, 34, 63, 0.08), 0 3px 6px rgba(9, 34, 63, 0.06);
  --shadow-lg:
    0 0 0 1px rgba(9, 34, 63, 0.1), 0 8px 16px rgba(9, 34, 63, 0.08);
  --shadow-xl:
    0 0 0 1px rgba(9, 34, 63, 0.12), 0 16px 32px rgba(9, 34, 63, 0.1);

  /* ─── Motion ─── */
  --ease-page: cubic-bezier(0.32, 0.72, 0, 1);
  --ease-ink: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-fold: cubic-bezier(0.7, 0, 0.84, 0);
  --ease-pop: cubic-bezier(0.34, 1.56, 0.64, 1); /* 로고 글자가 찍히며 튕기는 움직임 */
  --duration-fast: 180ms;
  --duration-base: 280ms;
  --duration-slow: 480ms;
  --duration-blink: 500ms; /* 로고 커서가 켜져 있거나 꺼져 있는 시간 */
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --duration-fast: 0ms;
    --duration-base: 0ms;
    --duration-slow: 0ms;
    --duration-blink: 0ms;
  }
}
/* ═══════════════════════════════════════════════════════════════
 * Typography utility classes
 * 토큰 기반 축약 + letter-spacing / text-transform 보강
 * Spec §3.2 · §3.3
 * ═══════════════════════════════════════════════════════════════ */

/* ─── Editorial Track ─────────────────────────────────────── */
.type-hero {
  font: var(--type-hero);
  letter-spacing: -0.02em;
}

.type-display {
  font: var(--type-display);
  letter-spacing: -0.01em;
}

.type-accent {
  font: var(--type-accent);
}

.type-sub {
  font: var(--type-sub);
}

.type-meta {
  font: var(--type-meta);
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* ─── UI Track ────────────────────────────────────────────── */
.type-h1 {
  font: var(--type-h1);
  letter-spacing: -0.01em;
}

.type-h2 {
  font: var(--type-h2);
}
.type-h3 {
  font: var(--type-h3);
}
.type-h4 {
  font: var(--type-h4);
}

.type-body-lg {
  font: var(--type-body-lg);
}
.type-body {
  font: var(--type-body);
}
.type-body-sm {
  font: var(--type-body-sm);
}

.type-caption {
  font: var(--type-caption);
}

.type-button {
  font: var(--type-button);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

/* ─── Responsive · 모바일 축소 (spec §3.3) ─────────────── */
@media (max-width: 767px) {
  .type-h1 {
    font-size: 48px;
  }
  .type-h2 {
    font-size: 32px;
  }
  .type-h3 {
    font-size: 24px;
  }
  /* body 유지 */
}

/* ─── Tabular numerics (spec §3.3 예외 목록) ──────────── */
.num-tabular {
  font-family: var(--font-sans);
  font-variant-numeric: tabular-nums;
}

</style>
