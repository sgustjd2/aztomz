    <section class="dx-hero">
      <div>
        <span class="dx-eyebrow">MZ 사전</span>
        <h1>요즘 말,<br><em>1초에</em> 해석.</h1>
        <p class="dx-lead">유행어·밈·신조어를 뜻·예쁜 우리말·출처까지 정리했어요. 한끗은 <b>출처를 확인한 뜻</b>만 담아요.</p>
        <form class="dx-search" id="dxForm" role="search">
          <input id="q" type="search" placeholder="어떤 말이 궁금해요?" aria-label="사전 검색" autocomplete="off">
          <button type="submit" aria-label="검색 결과로 이동">→</button>
        </form>
        <div class="dx-chips" id="dxChips"></div>
        <p class="dx-stat" id="freshline"></p>
      </div>
      <div id="dxToday"></div>
    </section>

    <section class="dx-list" id="words" aria-labelledby="dxTitle">
      <div class="dx-head"><h2 id="dxTitle">요즘, 이런 말.</h2><p>낯선 단어를 익숙한 이야기로.</p></div>
      <div class="dx-tabs" id="dxTabs" role="group" aria-label="단어 분류"></div>
      <p class="dx-count" id="count" aria-live="polite"></p>
      <div class="dx-grid" id="dxGrid"></div>
      <button type="button" class="dx-more" id="dxMore" hidden></button>
      <div class="dx-empty" id="empty" hidden>그 단어는 아직 사전에 없어요. <a href="index.html" style="color:var(--accent)">전체 트렌드</a>에서 찾아보세요.</div>

<script src="data/trends.js"></script>
<script src="assets/app.js?v=ref2-20261128"></script>
<script src="data/word-art.js"></script>
<script src="assets/word-art.js?v=auto-20261128"></script>
<script src="assets/fun.js?v=dict-20261128"></script>
<script>
  H.boot();
  const SLANG = H.TRENDS.filter(t=>t.coverCat==='cat-slang' || t.cat==='신조어')
    // 지금 쓰는 말 먼저, 그 안에서는 최근에 확인한 순
    .sort((a,b)=> (H.isFreshSlang(b)-H.isFreshSlang(a)) || (b.analyzedAt||'').localeCompare(a.analyzedAt||'') || (a.title||'').localeCompare(b.title||'', 'ko'));
  const STEP = 24;
  const TABS = [['all','전체',()=>true], ['fresh','요즘 쓰는 말', H.isFreshSlang], ['arch','지난 유행어', t=>!H.isFreshSlang(t)], ['kr','우리말로도', t=>!!t.pureKorean]];
  let tab = 'all', shown = STEP, query = H.param('q')||'';

  H.q('#freshline').textContent = `단어 ${SLANG.length}개` + (H.generatedAt ? ` · 기준일 ${H.fmtISO(H.generatedAt)}` : '');
  const def = (t)=> t.def || (t.excerpt||'').split(/(?<=[.!?。])\s/)[0] || t.excerpt || '';

  // 오늘의 말(그림 있는 가장 최근 단어)과 바로가기 칩
  const today = SLANG.find(t=>t.article && t.article.length) || SLANG[0];
  const tone = (art)=> art.match(/tone-\w+/)[0];
  if(today){ const art = H.wordArt(today); H.q('#dxToday').innerHTML = `<a class="dx-today" href="${H.detailHref(today.id)}">
    <span class="dx-today-art ${tone(art)}"><span class="dx-today-tag">오늘의 말 ↗</span>${art}</span>
    <span class="dx-today-body"><b>${H.esc(today.title)}</b><span>${H.esc(def(today))}</span></span></a>`; }
  H.q('#dxChips').innerHTML = '<span>요즘 궁금한 말</span>' + SLANG.filter(t=>t!==today && (t.title||'').length<=10).slice(0,3)
    .map(t=>`<a href="${H.detailHref(t.id)}">#${H.esc(t.title)}</a>`).join('');

  const card = (t, i)=>{ const art = H.wordArt(t); return `
    <a class="dx-card" href="${H.detailHref(t.id)}">
      <span class="dx-art ${tone(art)}">${art}
        <span class="dx-art-top"><span>${H.isFreshSlang(t)?'요즘 쓰는 말':'지난 유행어'}</span><span>${String(i+1).padStart(2,'0')}</span></span>
      </span>
      <span class="dx-body"><b>${H.esc(t.title)}</b><span>${H.esc(def(t))}</span>${t.pureKorean?`<em>우리말 · ${H.esc(t.pureKorean.split('(')[0].trim())}</em>`:''}<i>뜻 자세히 보기 →</i></span>
    </a>`; };

  function matches(t){
    const k = query.trim().toLowerCase();
    return !k || [t.title, def(t), t.pureKorean, ...(t.tags||[])].some(x=>String(x||'').toLowerCase().includes(k));
  }
  function render(){
    const found = SLANG.filter(matches);
    H.q('#dxTabs').innerHTML = TABS.map(([key,label,test])=>
      `<button type="button" data-tab="${key}" aria-pressed="${key===tab}">${label} <span>${found.filter(test).length}</span></button>`).join('');
    H.qa('#dxTabs button').forEach(b=> b.onclick=()=>{ tab = b.dataset.tab; shown = STEP; render(); H.q(`#dxTabs [data-tab="${tab}"]`).focus(); });
    const list = found.filter(TABS.find(x=>x[0]===tab)[2]);
    H.q('#dxGrid').innerHTML = list.slice(0, shown).map(card).join('');
    H.q('#count').textContent = query.trim() ? `“${query.trim()}” 검색 결과 ${list.length}개` : `${list.length}개의 말`;
    const rest = list.length - shown, more = H.q('#dxMore');
    more.hidden = rest <= 0; more.textContent = `단어 더 보기 (${Math.max(0,rest)}개 남음)`;
    H.q('#empty').hidden = list.length > 0;
  }
  H.q('#dxMore').onclick = ()=>{ const from = shown; shown += STEP; render(); const next = H.qa('#dxGrid .dx-card')[from]; if(next) next.focus({preventScroll:true}); };
  H.q('#q').value = query;
  H.q('#q').addEventListener('input', e=>{ query = e.target.value; shown = STEP; render(); });
  H.q('#dxForm').addEventListener('submit', e=>{ e.preventDefault(); H.q('#words').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); });
  render();
  if(query) H.q('#words').scrollIntoView();
</script>
