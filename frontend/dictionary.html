<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<title>MZ 사전 — 요즘 말, 1초에 해석 | 한끗</title>
<meta name="description" content="요즘 유행어·밈·신조어를 뜻·예쁜 우리말·출처와 함께 정리한 MZ 사전. 한끗이 출처까지 확인한 정확한 뜻만 담았습니다." />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="한끗" />
<meta property="og:locale" content="ko_KR" />
<meta property="og:title" content="MZ 사전 — 요즘 말, 1초에 해석 | 한끗" />
<meta property="og:description" content="요즘 유행어·밈·신조어를 뜻, 예문, 예쁜 우리말, 출처와 함께 확인하세요." />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="MZ 사전 — 요즘 말, 1초에 해석 | 한끗" />
<meta name="twitter:description" content="요즘 유행어·밈·신조어를 뜻, 예문, 예쁜 우리말, 출처와 함께 확인하세요." />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="assets/styles.css?v=category-sync-20261024" />
<style>
  .lead{padding:36px 0 8px;border-bottom:1px solid var(--line)}
  .lead h1{font-size:38px;font-weight:900;line-height:1.12;letter-spacing:0;margin:12px 0 10px}
  .lead h1 .hl{color:var(--pulse)}
  .lead p{font-size:15.5px;color:var(--body);max-width:44ch;margin:0;word-break:keep-all}
  @media(max-width:520px){.lead h1{font-size:29px}}
  @media(max-width:380px){.lead h1{font-size:26px}}
  .dict-tools{display:flex;gap:10px;align-items:center;margin:18px 0 6px;flex-wrap:wrap}
  .dict-search{flex:1;min-width:200px;padding:11px 14px;border:1.5px solid var(--line);border-radius:9px;
    background:var(--card);color:var(--ink);font-size:15px;font-family:inherit}
  .dict-search:focus{outline:none;border-color:var(--pulse)}
  .dict-count{font-size:13px;color:var(--ink-2);font-family:var(--serif)}
  /* 단어 카드 그리드 */
  .dlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:8px 0 28px;align-items:start}
  .dword{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:11px;
    padding:14px;text-decoration:none;color:inherit;transition:border-color .14s,background .14s}
  .dword:hover{border-color:#c5ceda;background:var(--paper-soft)}
  .dw-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:7px}
  .dw-term{font-size:18px;font-weight:800;line-height:1.35;letter-spacing:-.02em;color:var(--ink);margin-right:auto}
  .dw-def{margin:0;font-size:13.5px;color:var(--body);line-height:1.55;word-break:keep-all}
  .dw-ex{margin-top:9px;font-size:12.5px;color:var(--ink-2);background:transparent;border-left:2px solid var(--line);
    padding:2px 0 2px 9px;line-height:1.5;word-break:keep-all}
  .dw-kr{margin-top:8px;font-size:12.5px;color:var(--trust);font-weight:750}
  .dw-more{margin-top:8px;font-size:11.5px;color:var(--ink-2);font-weight:700}
  .dw-arch{font-size:10.5px;font-weight:750;color:var(--ink-2);background:var(--paper-2);
    border:1px solid var(--line);border-radius:4px;padding:1px 6px}
  .dword.is-arch{opacity:.62}
  .dword.is-arch:hover{opacity:.85}
  .dict-empty{padding:40px 0;text-align:center;color:var(--ink-2)}
</style>
</head>
<body>
  <div data-mast></div>
  <div class="wrap">

    <section class="lead">
      <span class="kicker">MZ 사전</span>
      <h1>요즘 말, <span class="hl">1초에 해석</span>.</h1>
      <p>유행어·밈·신조어를 뜻·예쁜 우리말·출처까지 정리했어요. 한끗이 <b>출처를 확인한 정확한 뜻</b>만 담습니다 — 떠도는 ‘대충 뜻’과 다릅니다.</p>
      <div class="freshline" id="freshline"></div>
    </section>

    <div class="dict-tools">
      <input class="dict-search" id="q" type="search" placeholder="단어·뜻으로 검색 (예: 샤갈, 웃음)" aria-label="사전 검색" />
      <span class="dict-count" id="count"></span>
    </div>

    <div class="sec-head" id="freshHead"><span class="no">01</span><h2>최신 신조어</h2><span class="note" id="freshNote"></span></div>
    <div class="dlist" id="freshList"></div>

    <div class="sec-head" id="archHead"><span class="no">02</span><h2>지난 유행어</h2><span class="note">읽을 수 있게 보관</span></div>
    <div class="dlist" id="archList"></div>
    <div class="dict-empty" id="empty" hidden>그 단어는 아직 사전에 없어요. <a href="index.html" style="color:var(--accent)">전체 트렌드</a>에서 찾아보세요.</div>

    <footer class="site"><a class="fwm footer-brand" href="index.html" aria-label="한끗 홈">한<b>끗</b></a><div class="footer-copy">AZ와 MZ는 한 끗 차이 · 트렌드 번역소<br>뜻은 출처를 확인해 싣지만, 신조어는 빨리 변해요. 날짜를 함께 봐주세요.</div></footer>
  </div>

<script src="data/trends.js"></script>
<script src="assets/app.js?v=category-sync-20261024"></script>
<script>
  H.boot();
  const SLANG = H.TRENDS.filter(t=>t.coverCat==='cat-slang' || t.cat==='신조어')
    // 신선한 단어 먼저, 한물간 건 뒤로(가나다순)
    .sort((a,b)=> (H.isFreshSlang(b)-H.isFreshSlang(a)) || (a.title||'').localeCompare(b.title||'', 'ko'));

  H.q('#freshline').innerHTML = `단어 ${SLANG.length}개`
    + (H.generatedAt ? ` · 기준일 ${H.fmtISO(H.generatedAt)}` : '');

  const def = (t)=> t.def || (t.excerpt||'').split(/(?<=[.!?。])\s/)[0] || t.excerpt || '';
  const row = (t)=>`
    <a class="dword${H.isFreshSlang(t)?'':' is-arch'}" href="trend.html?id=${encodeURIComponent(t.id)}">
      <div class="dw-top">
        <span class="dw-term">${H.esc(t.title)}</span>
      </div>
      <p class="dw-def">${H.esc(def(t))}</p>
      ${t.example?`<div class="dw-ex">"${H.esc(t.example)}"</div>`:''}
      ${t.pureKorean?`<div class="dw-kr">우리말 · ${H.esc(t.pureKorean)}</div>`:''}
      <div class="dw-more"><span>자세히·출처 →</span>${t.analyzedAt ? `<time class="dw-date" datetime="${H.esc(t.analyzedAt)}" aria-label="분석일 ${H.fmtISO(t.analyzedAt)}">${H.fmtISO(t.analyzedAt)}</time>` : ''}</div>
    </a>`;

  function render(q){
    const k = (q||'').trim().toLowerCase();
    const list = !k ? SLANG : SLANG.filter(t=>
      (t.title||'').toLowerCase().includes(k) ||
      (def(t)||'').toLowerCase().includes(k) ||
      (t.pureKorean||'').toLowerCase().includes(k) ||
      (t.tags||[]).some(x=>x.toLowerCase().includes(k)));
    const fresh = list.filter(H.isFreshSlang);
    const arch = list.filter(t=>!H.isFreshSlang(t));
    H.q('#freshList').innerHTML = fresh.map(row).join('');
    H.q('#archList').innerHTML = arch.map(row).join('');
    H.q('#freshList').hidden = fresh.length === 0;
    H.q('#archList').hidden = arch.length === 0;
    H.q('#freshHead').hidden = fresh.length === 0;
    H.q('#archHead').hidden = arch.length === 0;
    H.q('#empty').hidden = list.length>0;
    const freshN = SLANG.filter(H.isFreshSlang).length;
    H.q('#freshNote').textContent = k ? `${fresh.length}개` : `${freshN}개`;
    H.q('#count').textContent = k ? `${list.length} / ${SLANG.length}개` : `최신 ${freshN} · 전체 ${SLANG.length}개`;
  }
  render('');
  H.q('#q').addEventListener('input', e=> render(e.target.value));
</script>
</body>
</html>
