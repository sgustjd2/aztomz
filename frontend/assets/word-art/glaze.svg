<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#fdfcf8"/>
  <style>
    .ink{fill:none;stroke:#1c1c1c;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .paper{fill:#fdfcf8}
    .detail{stroke-width:.85}
    .praise{transform-box:fill-box;transform-origin:12% 90%;animation:praise 5.6s ease-in-out infinite}
    .crown{transform-box:fill-box;transform-origin:50% 100%;animation:crown 5.6s ease-in-out infinite}
    .shine{transform-box:fill-box;transform-origin:center;animation:shine 5.6s ease-in-out infinite}
    @keyframes praise{
      0%,100%{transform:rotate(0deg)}
      22%,42%{transform:rotate(-5deg)}
      32%{transform:rotate(-2deg)}
      65%,80%{transform:rotate(2deg)}
    }
    @keyframes crown{
      0%,100%{transform:rotate(-3deg) translateY(0)}
      35%{transform:rotate(3deg) translateY(-2px)}
      70%{transform:rotate(-1deg) translateY(1px)}
    }
    @keyframes shine{
      0%,100%{opacity:.4;transform:scale(.92)}
      35%{opacity:1;transform:scale(1.08)}
      70%{opacity:.65;transform:scale(1)}
    }
    @media (prefers-reduced-motion: reduce){ * { animation: none !important } }
  </style>
  <g class="ink">
    <!-- A small stage for a very large compliment. -->
    <path class="detail" d="M43 204q54-2 92 0m21 0q65-2 119 0"/>

    <!-- Pedestal. -->
    <path class="paper" d="M180 174q27-2 59 0l4 7q-31 2-67 0Z"/>
    <path class="paper" d="M183 182q2 9 1 16h49q-1-8 1-16"/>
    <path d="M179 198q29-1 59 0l2 6h-63Z"/>
    <path class="detail" d="M190 187v7m36-7v7"/>

    <!-- The person being extravagantly praised. -->
    <path class="paper" d="M203 124q-4 12-3 23l-6 22m14-44q1 12-1 24l-6 20"/>
    <path class="paper" d="M215 125q7 12 6 23l5 20m-4-44q7 13 6 24l4 20"/>
    <path class="paper" d="M194 168q4-1 8 1l-1 5h-14q-1-3 7-6Z"/>
    <path class="paper" d="M226 167q4 0 6 2l7 3q2 3-2 3h-13Z"/>

    <path class="paper" d="M204 91q-7 3-9 11l4 27q13 4 25-1l-2-26q-3-8-10-11"/>
    <path class="detail" d="M208 98q-1 12 1 22m-7 4 16 1"/>
    <path class="paper" d="M205 84l-1 8m7-7 1 7"/>
    <path class="paper" d="M205 69q-7 1-7 10t9 10q8-1 9-10t-11-10Z"/>
    <path d="M199 75q-2-8 6-9 8-1 11 6"/>
    <path class="detail" d="M201 69q4 3 10 2"/>

    <!-- A modestly raised hand: perhaps enough praise already. -->
    <path class="paper" d="M218 99q10 4 15 2l8-12m-20 15q10 5 15 1l8-14"/>
    <path d="M241 89l-1-6m3 6 1-8m1 9 3-6"/>
    <path class="paper" d="M197 101q-7 7-8 15l11 5m0-17q-5 6-5 9l7 4"/>

    <!-- An absurdly oversized crown. -->
    <g class="crown">
      <path fill="#d8b86b" d="m185 44 12 10 9-22 10 22 15-12-5 23q-18-3-36 0Z"/>
      <path class="detail" d="M191 60q17-3 34 0m-19-20v8"/>
      <path class="paper" d="m206 53 3 4-3 4-3-4Z"/>
      <circle cx="185" cy="42" r="1.5" fill="#1c1c1c" stroke="none"/>
      <circle cx="206" cy="30" r="1.5" fill="#1c1c1c" stroke="none"/>
      <circle cx="232" cy="40" r="1.5" fill="#1c1c1c" stroke="none"/>
    </g>

    <!-- The flatterer, leaning all the way into the compliment. -->
    <path class="paper" d="M82 150q-8 12-13 23l-9 23m29-44q-8 13-13 24l-9 21"/>
    <path class="paper" d="M91 151q6 11 10 22l6 23m-9-47q6 13 10 23l6 24"/>
    <path class="paper" d="M60 195q4-1 7 2l-1 6H51q-2-3 9-8Z"/>
    <path class="paper" d="M107 195q5-1 7 2l8 3q2 3-2 3h-15Z"/>
    <path class="paper" d="M103 115q-10 1-16 13l-8 24q9 6 20 1l9-23 10-8"/>
    <path class="detail" d="M88 143q5 3 12 2m-4-18 4-4"/>
    <path class="paper" d="m115 111-5 7m11-4-4 7"/>
    <path class="paper" d="M120 96q-8-2-11 5t4 12q8 4 12-3t-5-14Z"/>
    <path d="M109 102q-2-7 5-9 7-1 11 5"/>
    <path class="detail" d="m112 95 6 3"/>

    <g class="praise">
      <!-- Open, double-stroke arms reach toward the recipient. -->
      <path class="paper" d="M105 126q13 6 23-1l18-14m-38 21q13 6 23-1l18-15"/>
      <path d="m146 111 5-4m-2 9 6-3"/>
      <path class="paper" d="M111 121q10 1 18-7l9-12m-24 24q10 0 18-8l10-13"/>
      <path d="m138 102 4-5m0 8 5-4"/>

      <!-- Megaphone, aimed upward with excessive enthusiasm. -->
      <path class="paper" d="m143 103 4 9 13-3 13 3-10-24-8 11Z"/>
      <path fill="#c87d69" d="m163 88 10 24 5-2q-1-12-10-25Z"/>
      <path class="paper" d="m148 112 1 9 5-1-1-10"/>
      <path class="detail" d="m151 102 3 6"/>
    </g>

    <!-- Little bursts make the praise almost tangible. -->
    <g class="shine">
      <path d="m180 81 4-5m-5 16 7-1m-12-18 1-6"/>
      <path class="detail" d="m246 58 1-6m-3 3 6 1m-9 17 6-3"/>
      <path d="m259 91 2-6 2 6 6 2-6 2-2 6-2-6-6-2Z"/>
    </g>
  </g>
</svg>