<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#fdfcf8"/>
  <style>
    .breath{
      transform-box:fill-box;
      transform-origin:50% 100%;
      animation:breath 6s ease-in-out infinite;
    }
    .clock{
      transform-box:fill-box;
      transform-origin:50% 12%;
      animation:unease 6s ease-in-out infinite;
    }
    .steam{
      transform-box:fill-box;
      transform-origin:50% 100%;
      animation:steam 5s ease-in-out infinite;
    }
    @keyframes breath{
      0%,100%{transform:rotate(0deg) translateY(0)}
      45%,65%{transform:rotate(1.5deg) translateY(1px)}
    }
    @keyframes unease{
      0%,38%,64%,100%{transform:rotate(0deg)}
      44%,56%{transform:rotate(-2deg)}
      50%,60%{transform:rotate(2deg)}
    }
    @keyframes steam{
      0%,100%{transform:translateY(1px) skewX(-4deg);opacity:.35}
      50%{transform:translateY(-3px) skewX(5deg);opacity:.7}
    }
    @media (prefers-reduced-motion: reduce){ * { animation: none !important } }
  </style>
  <defs>
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".6" numOctaves="2" seed="8" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale=".35" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g fill="none" stroke="#1c1c1c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" filter="url(#ink)">
    <!-- A clock paused at two. -->
    <g class="clock">
      <path d="M257 56c1 12-8 22-20 22-13 0-22-9-22-21s9-21 21-21c12-1 21 8 21 20Z" fill="#fdfcf8"/>
      <g stroke-width=".8">
        <path d="M236 40v3m16 14h-3m-13 16v-3m-16-13h3"/>
        <path d="m244 43-1 2m7 20-2-1m-20 7 1-2m-6-21 2 1"/>
      </g>
      <path d="M236 57V45m0 12 10-6" stroke-width="1.9"/>
      <circle cx="236" cy="57" r="1.5" fill="#1c1c1c" stroke="none"/>
    </g>

    <!-- A generous paper margin surrounds the little desk. -->
    <path d="M54 207c37-1 66 1 96 0m16 0c38-1 70 1 99-1" stroke-width=".8" opacity=".45"/>

    <!-- Chair and grounded, open-stroke legs. -->
    <path d="M71 141c-2 9-2 20 0 29m0 0c12 1 24 1 37 0M75 172l-3 30m30-30 3 30"/>
    <path d="M91 157c13-1 22 4 28 12l-2 26m-33-32c12 0 21 4 27 10l-1 21" fill="#fdfcf8"/>
    <path d="M110 194c5 0 7 1 9 4l8 3c2 1 2 3-1 3h-18c-2-2-1-6 2-10Z" fill="#fdfcf8"/>
    <path d="M84 162c9 6 16 13 15 22l-6 13m-17-31c8 8 15 13 14 18l-4 12" fill="#fdfcf8"/>
    <path d="M86 195c4 0 7 1 9 4l6 3c2 1 1 3-1 3H82c-1-4 1-7 4-10Z" fill="#fdfcf8"/>

    <!-- The investor sinks a little into a supporting hand. -->
    <g class="breath">
      <path d="M80 115c-7 9-7 25-6 43 8 5 19 7 30 4l-2-40-10-10Z" fill="#a5b5b1"/>
      <path d="m87 110-1 7m7-9 1 7"/>
      <path d="M81 91c-1 8 2 17 9 20 6 1 11-5 12-12 1-8-3-13-10-14-5-1-9 1-11 6Z" fill="#fdfcf8"/>
      <path d="M80 96c-3-10 3-16 10-15 7-1 13 4 13 11-5 0-9-2-12-5-1 5-5 7-11 9Z" fill="#1c1c1c" stroke-width="1.4"/>
      <path d="M84 122c7 6 14 11 25 13 6-7 9-16 9-25m-31 5c7 6 14 10 19 11 3-5 5-11 5-17" fill="#fdfcf8"/>
      <path d="M111 109c-1-3-4-6-4-9 0-2 2-2 3 0l3 4c-1-5-2-9 0-9 2 0 2 4 3 6 3 1 4 4 2 9" fill="#fdfcf8" stroke-width="1.4"/>
      <path d="M80 130c-1 8 2 14 9 16l37-1m-40-17c-1 5 0 9 5 10l34 1" fill="#fdfcf8"/>
      <path d="M125 139c4-2 8-1 10 1m-10 5c5 1 9 0 11-2" stroke-width="1.4"/>
      <path d="M78 151c5 3 11 4 15 4m-5-35 5 4" stroke-width=".8"/>
    </g>

    <!-- Monitor: a calm morning line gives way to a steep red fall. -->
    <path d="M155 99c25-1 52 0 78-1 3 0 4 2 4 5l-1 38c0 3-1 4-4 4l-78 1c-3 0-4-2-4-4l1-39c0-3 1-4 4-4Z" fill="#fdfcf8"/>
    <path d="m156 104 75-1-1 35-75 1Z" stroke-width=".8"/>
    <path d="M161 131h62m-62-1v-19" stroke-width=".8" opacity=".5"/>
    <path d="m162 119 11-3 9 2 9-5 9 2" stroke-width="1.5"/>
    <path d="m200 115 7 8 5-3 11 14m-7-2 7 2 1-7" stroke="#b96352" stroke-width="2"/>
    <path d="m187 146-1 9m13-9 1 9m-21 2c8-2 16-2 25-1" stroke-width="1.5"/>

    <!-- A forgotten cup, with a quiet curl of steam. -->
    <path d="M246 139c4-1 8-1 12 0l-1 14c-3 3-7 3-10 0Z" fill="#fdfcf8" stroke-width="1.5"/>
    <path d="M259 141c8-2 8 9-1 9m-14 7c5 2 12 2 17 0" stroke-width="1.4"/>
    <g class="steam" stroke-width=".8" opacity=".6">
      <path d="M249 133c-4-4 4-6 1-11m6 12c4-4-3-7 0-10"/>
    </g>

    <!-- Simple bowed desk edges keep the drawing light. -->
    <path d="M122 158c46-1 94 0 144-1l1 6c-46 1-94 0-145 1Z" fill="#fdfcf8"/>
    <path d="m132 165-2 38m7-38-2 38m119-39 2 39m-7-39 2 39" stroke-width="1.6"/>
  </g>
</svg>