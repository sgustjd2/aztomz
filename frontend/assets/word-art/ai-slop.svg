<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#fdfcf8"/>
  <style>
    .ink{fill:none;stroke:#1c1c1c;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .paper{fill:#fdfcf8}
    .detail{stroke-width:.8}
    .person{transform-box:fill-box;transform-origin:50% 100%;animation:recoil 7s ease-in-out infinite}
    .spill{transform-box:fill-box;transform-origin:50% 50%;animation:drift 6s ease-in-out infinite}
    .spill.second{animation-delay:-3s}
    .heap{transform-box:fill-box;transform-origin:50% 100%;animation:settle 5s ease-in-out infinite}
    @keyframes recoil{
      0%,25%,100%{transform:rotate(0deg)}
      48%,66%{transform:rotate(-3deg)}
    }
    @keyframes drift{
      0%,100%{transform:translate(-2px,-3px) rotate(-4deg)}
      55%{transform:translate(4px,5px) rotate(5deg)}
    }
    @keyframes settle{
      0%,100%{transform:rotate(-1deg)}
      50%{transform:rotate(1.5deg)}
    }
    @media (prefers-reduced-motion: reduce){ * { animation: none !important } }
  </style>

  <g class="ink">
    <!-- A quiet patch of ground. -->
    <path class="detail" d="M49 205 Q92 203 123 205 M185 205 Q230 207 277 204"/>

    <!-- Faceless reader, withdrawing from the feed. -->
    <g class="person">
      <path class="paper" d="M75 79 C73 69 78 60 86 61 C95 62 99 72 95 81 C92 88 82 89 77 84"/>
      <path d="M75 76 Q70 64 80 59 Q91 55 96 66 M77 65 Q85 69 94 65"/>
      <path d="M82 88 L81 95 M89 89 L89 95"/>
      <path class="paper" d="M79 94 Q69 98 68 111 L65 145 Q79 151 98 145 L94 111 Q92 98 89 95"/>
      <path class="detail" d="M72 111 Q75 124 72 137 M86 99 Q83 104 80 106"/>
      <path d="M72 148 Q70 166 67 180 L64 198 M79 150 Q79 169 74 182 L71 197"/>
      <path class="paper" d="M63 197 Q68 195 72 198 L77 202 Q71 205 60 203"/>
      <path d="M88 150 Q93 164 91 178 L94 196 M96 149 Q101 164 98 179 L101 196"/>
      <path class="paper" d="M94 196 Q98 194 102 198 Q109 199 110 203 Q102 205 92 203"/>
      <!-- Two open pen strokes for each arm. -->
      <path class="paper" stroke="none" d="M92 104 Q101 115 111 119 L135 109 L138 115 L112 127 Q100 125 90 113Z"/>
      <path d="M93 104 Q101 115 111 119 L133 110 M91 113 Q100 125 112 127 L135 116"/>
      <path d="M133 110 Q139 104 141 108 Q142 111 138 114 M135 116 L139 114"/>
      <path class="paper" stroke="none" d="M70 104 Q62 114 60 125 L77 136 L80 130 L67 122 L76 111Z"/>
      <path d="M70 104 Q62 114 60 125 Q65 130 76 136 M76 111 L67 122 L80 130"/>
      <path d="M77 136 Q82 139 85 135 M80 130 Q86 130 86 133"/>
    </g>

    <!-- A phone whose feed is spilling into the world. -->
    <g transform="rotate(-7 157 107)">
      <path class="paper" d="M139 60 Q136 60 136 65 L136 145 Q136 150 141 150 L174 150 Q179 150 179 145 L179 65 Q179 60 174 60Z"/>
      <path class="detail" d="M150 65 Q157 66 164 65 M141 139 Q157 138 174 139"/>
      <path class="paper" d="M141 73 Q156 72 174 73 L174 100 L141 100Z"/>
      <path fill="#a4afa0" stroke-width=".8" d="M143 97 L150 86 L157 93 L163 83 L172 97Z"/>
      <circle class="detail" cx="166" cy="79" r="2"/>
      <path class="detail" d="M142 106 Q157 105 173 106 M142 110 L165 111"/>
      <!-- A tiny, vacant machine portrait. -->
      <path fill="#d2b579" d="M148 119 Q157 117 166 119 L166 132 L148 132Z"/>
      <path class="detail" d="M157 118 L157 115 M145 123 L148 123 M166 123 L169 123"/>
      <circle cx="153" cy="124" r=".8" fill="#1c1c1c" stroke="none"/>
      <circle cx="161" cy="124" r=".8" fill="#1c1c1c" stroke="none"/>
      <path class="detail" d="M153 128 L161 128"/>
      <path class="detail" d="M153 144 Q157 145 161 144"/>
    </g>

    <!-- Repeated, empty picture cards drift out of the screen. -->
    <g class="spill">
      <path class="paper" d="M187 80 L211 86 L205 108 L181 101Z"/>
      <path class="detail" d="M185 98 L193 90 L197 97 L201 94 L205 104 M203 89 L203 90"/>
      <path class="detail" d="M180 78 Q184 75 188 76"/>
    </g>
    <g class="spill second">
      <path fill="#a4afa0" fill-opacity=".35" d="M215 111 L238 105 L244 127 L221 134Z"/>
      <path class="detail" d="M221 128 L226 118 L232 122 L235 116 L240 125"/>
      <circle class="detail" cx="223" cy="114" r="1.5"/>
      <path class="detail" d="M246 116 Q251 121 250 126"/>
    </g>

    <!-- The same feed becomes an overflowing rubbish bin. -->
    <g class="heap">
      <path class="paper" d="M218 164 L210 143 L231 136 L239 157Z"/>
      <path class="detail" d="M216 153 L221 145 L227 149 L229 143 L234 154"/>
      <path fill="#d2b579" d="M238 160 L242 138 L260 142 L257 164Z"/>
      <path class="detail" d="M247 145 L254 146 M246 150 L253 151 M245 155 L250 156"/>
      <path class="paper" d="M224 168 L228 148 L250 152 L247 172Z"/>
      <path class="detail" d="M231 163 L236 157 L240 162 L244 159"/>
      <path class="paper" d="M206 163 Q212 153 220 161 Q225 151 231 160 Q240 155 245 164 Q255 155 264 165"/>
    </g>
    <path fill="#a4afa0" fill-opacity=".3" d="M209 167 Q235 170 261 167 L255 199 Q233 204 215 198Z"/>
    <path class="paper" d="M205 164 Q233 167 265 164 L264 171 Q235 174 207 170Z"/>
    <path class="detail" d="M220 178 L223 193 M235 180 L235 195 M250 178 L247 193"/>

    <!-- One last discarded copy. -->
    <path class="paper" d="M177 192 L195 186 L203 199 L185 204Z"/>
    <path class="detail" d="M183 196 L188 191 L191 195 L195 192 L199 198"/>
  </g>
</svg>