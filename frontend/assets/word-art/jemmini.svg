<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#fdfcf8"/>
  <style>
    .ink{fill:none;stroke:#1c1c1c;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .paper{fill:#fdfcf8}
    .detail{stroke-width:.85}
    .person{transform-box:fill-box;transform-origin:48% 100%;animation:lean 6s ease-in-out infinite}
    .answer{transform-box:fill-box;transform-origin:50% 50%;animation:answer 6s ease-in-out infinite}
    .steam{transform-box:fill-box;transform-origin:50% 100%;animation:steam 6s ease-in-out infinite}
    @keyframes lean{
      0%,100%{transform:rotate(-1deg)}
      38%,62%{transform:rotate(2deg)}
    }
    @keyframes answer{
      0%,100%{opacity:.5;transform:scale(.93)}
      35%,65%{opacity:1;transform:scale(1.05)}
    }
    @keyframes steam{
      0%,100%{opacity:.35;transform:translateY(2px)}
      50%{opacity:.8;transform:translateY(-3px)}
    }
    @media (prefers-reduced-motion: reduce){ * { animation: none !important } }
  </style>
  <defs>
    <filter id="ink-wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".6" numOctaves="1" seed="8" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale=".35" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g class="ink" filter="url(#ink-wobble)">
    <!-- Quiet ground, with room around the drawing. -->
    <path class="detail" d="M45 201q38-1 70 0m16 0q67-1 142 0" opacity=".35"/>

    <!-- Two lunches waiting on the same little counter. -->
    <path class="paper" d="M151 151q52-2 113 0l3 7q-59 2-118 0Z"/>
    <path d="M159 159q-1 20-2 40m4-40q0 21-1 40m94-40q1 20 2 40m3-40q1 21 2 40"/>
    <path class="detail" d="M162 184q43-1 91 0"/>

    <!-- A warm bowl of noodles. -->
    <path class="paper" d="M160 134q17-3 35 0-2 15-17 16-15-1-18-16Z"/>
    <path d="M160 134q16 5 35 0"/>
    <path class="detail" d="M165 134q3-6 6-1t6-1 6 1 6-1"/>
    <path d="m183 126 10-15m-5 16 11-14"/>
    <g class="steam detail">
      <path d="M165 124c-5-5 4-8 0-13m11 12c-4-5 4-8 1-13"/>
    </g>

    <!-- A second, untouched lunch. -->
    <path class="paper" d="M218 146q19-5 38 0-1 6-19 6-18 0-19-6Z"/>
    <path class="paper" d="m225 143 12-22q2-3 4 0l12 23q-14 4-28-1Z"/>
    <path d="M235 145v-9q4-2 8 0v9" fill="#687b72"/>
    <path class="detail" d="m232 130 1-1m10 1 1 1"/>

    <!-- An adult checking the phone before making even this choice. -->
    <g class="person">
      <!-- Open trouser legs and small shoes. -->
      <path d="M85 145q-3 18-5 47m9-45q0 22-4 45"/>
      <path d="M99 145q5 21 8 46m-3-47q6 21 8 46"/>
      <path class="paper" d="M79 191q-4 4-4 7 7 2 16 0l-5-7"/>
      <path class="paper" d="M106 191q0 5 1 7 10 1 17-1-3-4-12-7"/>

      <!-- The far arm hangs loosely, its strokes left open at the hand. -->
      <path class="paper" d="M78 103q-7 14-7 31l5 12 4-2-4-12q1-14 7-25"/>
      <path class="detail" d="m76 145 2 3"/>

      <!-- A quiet, slightly uneven sage shirt. -->
      <path d="M82 94q11-4 22 1l8 20-9 4 3 29q-16 4-29-1l3-29-7-3Z" fill="#687b72"/>
      <path class="detail" d="M82 141q10 2 20 0m-1-42q2 8 6 13"/>

      <!-- Small faceless head, hair and an open neck. -->
      <path d="m89 91-1 5m8-7 1 6"/>
      <path class="paper" d="M85 73q1-11 11-10 12 2 11 13l-2 11q-4 7-11 3-8-4-9-17Z"/>
      <path d="M85 78q-6-15 5-19 10-4 17 5l1 10q-7-2-11-9-3 8-12 8" fill="#1c1c1c" stroke-width="1.4"/>
      <path class="detail" d="M86 79q-4-3-3 1t5 4"/>

      <!-- Bent forearm brings the phone close. -->
      <path class="paper" d="M107 108q8 10 13 10 7-4 13-14l4 3q-5 14-16 18-9 0-17-10"/>
      <path class="detail" d="M115 118q2 2 5 2"/>

      <!-- The AI is identified by a simple sparkle, without lettering. -->
      <g transform="rotate(9 139 96)">
        <path class="paper" d="M129 77q10-2 21 0l1 35q-10 3-22 0Z"/>
        <path class="detail" d="M132 82h15l1 24h-16Z"/>
        <path class="detail" d="M138 109h4"/>
        <g class="answer">
          <path d="M140 87q1 6 6 7-5 1-6 7-1-6-6-7 5-1 6-7Z" fill="#687b72" stroke-width="1.4"/>
        </g>
      </g>
      <path class="paper" d="M132 107q-2-7 1-8 2 0 3 5l3-2q3 1 1 5l-4 4"/>
    </g>

    <!-- The phone supplies the answer: a dotted recommendation to the bowl. -->
    <g class="answer">
      <path class="detail" d="M155 86c19-12 35-2 30 17" stroke-dasharray="2 4"/>
      <path d="m180 99 4 6 5-5" stroke-width="1.4"/>
      <path class="detail" d="m158 69 2-5m9 9 4-3"/>
    </g>
  </g>
</svg>