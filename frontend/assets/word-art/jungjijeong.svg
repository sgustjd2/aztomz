<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#fdfcf8"/>
  <style>
    .sway{transform-box:fill-box;transform-origin:50% 95%;animation:sway 6s ease-in-out infinite}
    .idea{transform-box:fill-box;transform-origin:50% 65%;animation:idea 6s ease-in-out infinite}
    .change{transform-box:fill-box;transform-origin:center;animation:change 6s ease-in-out infinite}
    @keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
    @keyframes idea{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-3px) rotate(3deg)}}
    @keyframes change{0%,35%,100%{opacity:1}46%,84%{opacity:0}}
    @media (prefers-reduced-motion: reduce){ * { animation: none !important } }
  </style>
  <defs>
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".065" numOctaves="2" seed="8"/>
      <feDisplacementMap in="SourceGraphic" scale=".45"/>
    </filter>
  </defs>
  <g stroke="#1c1c1c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#ink)">
    <!-- A three-part phrase, assembled from interchangeable meanings. -->
    <path d="M113 73Q181 71 248 74L247 137Q182 139 113 137Z" fill="#fdfcf8"/>
    <path d="M123 83Q139 82 156 83L156 126Q140 127 123 126Z" fill="#fdfcf8"/>
    <path d="M163 83Q179 82 196 83L196 126Q180 127 163 126Z" fill="#fdfcf8"/>
    <path d="M203 83Q219 82 236 83L236 126Q220 127 203 126Z" fill="#fdfcf8"/>
    <g stroke-width=".8">
      <path d="M157 104h5m-2-2 2 2-2 2M197 104h5m-2-2 2 2-2 2"/>
      <path d="M128 87h5m35 0h5m35 0h5"/>
    </g>

    <!-- Each slot remains complete when motion is disabled. -->
    <path d="M130 114Q128 99 147 94Q150 110 130 114Z" fill="#a5b7a3"/>
    <path d="M131 113Q137 106 143 101" stroke-width=".8"/>
    <path d="m181 92-9 15 8-1-3 12 12-17-9 2Z" fill="#c97c65"/>

    <g>
      <path d="m219 93 3 8 9 1-7 6 2 9-7-5-7 5 2-9-7-6 9-1Z" fill="#a5b7a3"/>
      <g class="change">
        <path d="M205 87H234V122H205Z" fill="#fdfcf8" stroke="none"/>
        <path d="M219 115Q205 105 210 99Q215 94 219 101Q223 94 228 99Q233 105 219 115Z" fill="#c97c65"/>
      </g>
    </g>

    <!-- A faceless maker gives the shared phrase another interpretation. -->
    <g class="sway">
      <path d="M68 103Q61 101 61 92Q60 82 67 80Q76 78 78 87L77 97Q75 103 70 103" fill="#fdfcf8"/>
      <path d="M61 91Q57 80 66 77Q75 74 79 84Q73 82 70 86Q66 84 61 91" fill="#1c1c1c"/>
      <path d="M66 104v6m7-7 1 7" stroke-width="1.5"/>
      <path d="M61 111Q68 108 77 111L84 151Q71 155 55 151Z" fill="#a5b7a3"/>
      <path d="M60 115Q53 125 49 139Q54 145 61 147M64 118Q58 129 55 137L64 141" fill="#fdfcf8"/>
      <path d="M76 113Q84 119 91 119L105 109M75 120Q83 127 93 125L108 114" fill="#fdfcf8"/>
      <path d="M105 109q4-5 6-2m-3 7q6-2 5-5" stroke-width="1.4"/>
    </g>
    <path d="M61 153Q60 166 58 180L53 193M67 155Q67 169 64 182L60 194" fill="#fdfcf8"/>
    <path d="M73 154Q78 166 79 179L87 191M80 153Q85 165 85 177L92 189" fill="#fdfcf8"/>
    <path d="M53 192q-4 2-5 6l15 1q2-2-3-5M87 191q0 6 3 7l14-1q0-4-12-7" fill="#fdfcf8"/>

    <!-- A loose replacement tile waits beside the three slots. -->
    <g class="idea">
      <path d="m252 109 20 7-9 29-21-7Z" fill="#fdfcf8"/>
      <path d="M250 132q-3-9 4-12 8-3 10 4-7-2-10 10" fill="#a5b7a3"/>
      <path d="m253 133 7-8" stroke-width=".8"/>
    </g>

    <!-- Spare meanings in a small card tray. -->
    <path d="m163 174 5-24 25 5-4 23Z" fill="#fdfcf8"/>
    <path d="m176 173 5-27 25 5-5 26Z" fill="#fdfcf8"/>
    <path d="M188 157q4-5 8-1l-1 7-5 4-4-6Z" fill="#c97c65" stroke-width="1"/>
    <path d="M153 169Q179 167 210 169L206 190Q180 193 157 190Z" fill="#fdfcf8"/>
    <path d="M158 175q23 3 47 0m-31 9 12 .2" stroke-width=".8"/>
    <path d="M119 139q-1 23-3 43m125-43 3 44"/>
    <path d="M106 184q8-2 19 0m110 1q9-2 18 0" stroke-width="1.4"/>
    <path d="M43 201q27 2 62 0m36 0q40 2 77 0m15 0h34" stroke-width=".8"/>
  </g>
</svg>