<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#fdfcf8"/>
  <style>
    .ink{fill:none;stroke:#1c1c1c;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .detail{stroke-width:.85}
    .paper{fill:#fdfcf8}
    .breath{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 6s ease-in-out infinite}
    .shine{transform-box:fill-box;transform-origin:center;animation:shine 6s ease-in-out infinite}
    .sweat{transform-box:fill-box;transform-origin:center;animation:sweat 6s ease-in-out infinite}
    @keyframes breathe{
      0%,100%{transform:translateY(0) rotate(0)}
      45%{transform:translateY(1.4px) rotate(-.6deg)}
      70%{transform:translateY(.3px) rotate(.2deg)}
    }
    @keyframes shine{
      0%,32%,65%,100%{opacity:.25;transform:scale(.85)}
      44%,52%{opacity:1;transform:scale(1)}
    }
    @keyframes sweat{
      0%,100%{opacity:.7;transform:translateY(0)}
      55%{opacity:.3;transform:translateY(2px)}
    }
    @media (prefers-reduced-motion: reduce){ * { animation: none !important } }
  </style>
  <defs>
    <filter id="ink-wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".6" numOctaves="2" seed="8" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale=".35" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g class="ink" filter="url(#ink-wobble)">
    <!-- A rolled-edge exercise mat gives the scene a quiet ground. -->
    <path d="M64 191Q61 188 67 184L223 181Q228 181 234 186L252 200Q256 204 249 206L84 209Q79 209 75 205Z" fill="#e6ebe3"/>
    <path class="detail" d="M79 204Q159 201 248 201M70 188l11 10M89 187l8 8"/>

    <!-- Planted legs, with separate open contours. -->
    <path class="paper" stroke="none" d="M133 129L147 130L143 159L138 188L129 188L131 159ZM150 130L162 129L163 158L174 186L166 189L153 161Z"/>
    <path d="M133 131Q132 147 132 159L129 184M146 133Q145 148 142 160L138 185"/>
    <path d="M151 133Q152 150 154 161L165 184M162 131Q161 145 164 158L173 182"/>
    <path class="paper" d="M129 184q4 3 9 1l2 6q8 3 9 6-9 3-23 1l1-8Z"/>
    <path class="detail" d="M128 194q10 2 17 1M132 188l5 2"/>
    <path class="paper" d="M165 183q4 2 8-1l5 7q9 1 11 5-7 5-20 6l-6-9Z"/>
    <path class="detail" d="M168 195q11-1 17-3M170 186l4 3"/>

    <g class="breath">
      <!-- One arm rests at the hip after the workout. -->
      <path class="paper" stroke="none" d="M128 81Q115 90 111 106Q113 114 130 123L134 118Q122 109 119 105L134 89Z"/>
      <path d="M128 81Q116 88 111 104Q109 110 127 122"/>
      <path d="M132 89Q124 96 119 105Q121 109 132 116"/>
      <path class="detail" d="M127 122q6 3 8-1l-3-5"/>

      <!-- Relaxed shorts and a simple muted training shirt. -->
      <path class="paper" d="M132 117Q145 120 160 116L164 139Q155 142 149 139l-3-10-2 11q-8 2-14-1Z"/>
      <path class="detail" d="M133 122q12 3 26-1M147 124l1 3"/>
      <path d="M137 74Q143 78 151 74L162 81Q157 97 160 117Q146 122 131 117Q133 100 127 84Z" fill="#aab9a4"/>
      <path class="detail" d="M137 77q6 7 14 0M133 112q9 3 17 1M156 94l-1 10"/>

      <!-- Open neck and small faceless head, turned toward the phone. -->
      <path d="M139 75l1-10M149 74l-1-9"/>
      <path class="paper" d="M135 49Q141 42 150 47Q155 51 153 58l2 3-4 2q-1 8-8 7-8-2-9-10-2-6 1-11Z"/>
      <path d="M134 58q-5-10 2-15 7-5 13 0 5 0 6 7-7 2-12-2-1 8-9 10Z" fill="#1c1c1c" stroke-width="1.4"/>
      <path class="detail" d="M136 58q-4-2-3 2l3 3"/>

      <!-- Raised phone: a post-workout mirror selfie. -->
      <path class="paper" stroke="none" d="M159 81Q170 86 179 88L193 66L199 69L185 96Q181 100 174 97L158 89Z"/>
      <path d="M160 81Q169 85 178 88L190 69"/>
      <path d="M158 89Q169 95 179 98Q183 99 186 94L198 72"/>
      <g transform="rotate(12 198 62)">
        <rect class="paper" x="189" y="46" width="18" height="30" rx="3"/>
        <rect x="192" y="49" width="5" height="8" rx="1.6" stroke-width=".85"/>
        <circle cx="194.5" cy="51.6" r=".8" fill="#1c1c1c" stroke="none"/>
        <circle cx="194.5" cy="54.5" r=".8" fill="#1c1c1c" stroke="none"/>
        <path class="detail" d="M200 68h2"/>
      </g>
      <path class="paper" d="M190 72q-3-1-3-4l1-5q1-3 3-1l1 4 5-2q3 0 2 3l-1 5"/>
      <path class="detail" d="M192 69l5-2"/>

      <g class="sweat detail">
        <path d="M124 62q-3 3-2 5M120 73l-3 2M161 58l3 4"/>
      </g>
    </g>

    <!-- A resting dumbbell and water bottle complete the workout. -->
    <g transform="rotate(-12 91 183)">
      <path d="M80 182h20" stroke-width="3"/>
      <path class="paper" d="M74 175q3-2 6 0v15q-3 2-6 0Z"/>
      <path class="paper" d="M69 178q2-1 5 0v9q-2 2-5 0Z"/>
      <path class="paper" d="M100 175q3-2 6 0v15q-3 2-6 0Z"/>
      <path class="paper" d="M106 178q2-1 5 0v9q-2 2-5 0Z"/>
    </g>
    <path class="paper" d="M220 169v5q-5 3-5 8l1 16q7 3 14 0l1-16q0-5-5-8v-5"/>
    <path class="paper" d="M219 166q4-1 8 0v5h-8Z"/>
    <path class="detail" d="M216 185q7 2 14 0M219 189l1 6M220 168h6"/>

    <g class="shine" stroke-width="1.2">
      <path d="M223 52q0 6-5 7 5 0 5 6 0-6 5-6-5-1-5-7Z"/>
      <path d="M234 71v5M231.5 73.5h5"/>
    </g>
    <path class="detail" d="M57 211h10M244 213h14"/>
  </g>
</svg>