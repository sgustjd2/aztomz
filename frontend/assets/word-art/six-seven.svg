<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#fdfcf8"/>
  <style>
    .ink{fill:none;stroke:#1c1c1c;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .paper{fill:#fdfcf8}
    .detail{stroke-width:.8}
    .speaker{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
    .listener{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out -2s infinite}
    .hands{transform-box:fill-box;transform-origin:50% 65%;animation:shrug 6s ease-in-out infinite}
    .echo{transform-box:fill-box;transform-origin:50% 80%;animation:float 6s ease-in-out infinite}
    .echo-late{animation-delay:-2s}
    @keyframes sway{
      0%,100%{transform:rotate(-1deg)}
      35%{transform:rotate(1.8deg)}
      65%{transform:rotate(.3deg)}
    }
    @keyframes shrug{
      0%,100%{transform:translateY(1px) rotate(-1deg)}
      28%,42%{transform:translateY(-2px) rotate(2deg)}
      68%{transform:translateY(0) rotate(-1deg)}
    }
    @keyframes float{
      0%,100%{transform:translateY(1px) rotate(-3deg);opacity:.7}
      40%,60%{transform:translateY(-3px) rotate(3deg);opacity:1}
    }
    @media (prefers-reduced-motion: reduce){ * { animation: none !important } }
  </style>
  <defs>
    <filter id="ink-wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".055" numOctaves="2" seed="8" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale=".45" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g class="ink" filter="url(#ink-wobble)">
    <!-- A quiet patch of ground. -->
    <path class="detail" d="M57 201q30-1 47 0m8 0q52 2 83 0m12 0q30-1 52 0"/>

    <!-- A small plant, with plenty of paper around it. -->
    <path class="paper" d="M56 182q10 1 19 0l-3 17q-6 2-13 0Z"/>
    <path class="detail" d="M57 186q9 1 17 0"/>
    <path d="M65 182q3-12-1-23m2 16q-10-1-11-10 9-1 11 7m0-5q9-2 10-10-9 0-11 7"/>

    <!-- One friend tosses out a cheerful, inexplicable remark. -->
    <g class="speaker">
      <path class="paper" d="M108 160q-2 16-4 32m5-1q5-17 8-28"/>
      <path class="paper" d="M120 161q4 14 8 29m5-1q-2-18-6-29"/>
      <path class="paper" d="M104 191q-3 2-6 5-1 3 4 3l9-1q1-4-2-6"/>
      <path class="paper" d="M128 190q0 5 2 7l11 1q3-1 0-3l-8-5"/>

      <path fill="#b7c4c3" d="M107 120q10-4 19 0l5 38q-12 5-27 0Z"/>
      <path class="detail" d="M108 151q10 2 20 0m-15-28q3 2 7 0"/>
      <path d="M113 112l-1 7m8-7 1 7"/>

      <g class="hands">
        <path class="paper" d="M107 123q-8 7-15 13-4-6-9-10m20 5-11 11q-4 2-7-2l-7-11"/>
        <path d="M83 126q-3-2-7-1m3 4q-5 0-8-3m7 0-2-4"/>

        <path class="paper" d="M126 123q8 7 15 13l10-10m-23 5 11 11q3 2 6-1l10-11"/>
        <path d="M151 126q4-2 8-1m-4 5q5-1 8-4m-7 0 2-4"/>
      </g>

      <path class="paper" d="M108 97q0-9 8-10 9-1 10 8l-1 12q-2 7-9 7-7-1-8-8Z"/>
      <path d="M108 100q-3-8 2-12 6-6 13-1 5 3 4 10m-19-2q7 1 12-5 0 5 6 7"/>
    </g>

    <!-- The other friend joins in, palms lifted in easy agreement. -->
    <g class="listener">
      <path d="M202 160q-3 17-3 32m5 0 6-30m4 0q2 15 7 29m5-1q-2-18-5-29"/>
      <path class="paper" d="M199 191q-5 3-7 5-1 3 3 3l10-1v-6"/>
      <path class="paper" d="M221 190q-1 5 1 7l11 1q4-1 0-3l-7-5"/>

      <path class="paper" d="M200 121q9-4 20-1l6 39q-14 5-28 0Z"/>
      <path class="detail" d="M201 134q10 2 21 0m-22 7q12 2 23 0m-24 7q12 2 25 0"/>
      <path d="M206 113v7m7-7 2 6"/>

      <path class="paper" d="M201 124q-8 11-14 11l-8-8m23 5q-9 12-16 9l-11-10"/>
      <path d="M179 127q-4-3-8-2m4 6q-5-1-7-4m7-1-2-4"/>
      <path class="paper" d="M220 123q8 10 13 12l9-7m-21 3q8 11 14 10l11-9"/>
      <path d="M242 128q4-2 8-1m-4 5q5-1 7-4m-7 0 1-4"/>

      <path class="paper" d="M200 98q-1-9 7-11 8-2 11 6l2 12q-1 8-8 9-8 0-10-7Z"/>
      <path fill="#1c1c1c" stroke-width=".8" d="M200 102q-5-5-3-11 2-7 10-7 8-1 12 6l1 8-4-4-1-5q-4 6-15 5Z"/>
    </g>

    <!-- A low stool and a little cup. -->
    <path class="paper" d="M149 179q12-2 25 0l1 5q-13 2-27 0Z"/>
    <path d="M151 185l-3 15m23-15 3 15"/>
    <path class="paper" d="M156 165q5 1 11 0l-1 12q-4 2-9 0Z"/>
    <path d="M168 168q7-1 6 3-1 4-7 3"/>
    <path class="detail" d="M157 165q5-2 10 0"/>

    <!-- Wordless, deliberately nonsensical little echoes. -->
    <g class="echo">
      <path class="paper" d="M124 76q-8-3-6-10 1-6 8-6 0-7 8-6 5-8 12-3 8-3 11 5 9 1 8 8 7 7-1 12-4 5-12 3-6 4-13 0l-10 5 2-8"/>
      <path d="M130 67q3-6 7-1t7-1"/>
      <path d="M151 61l1 3 4 1-3 2v4l-3-2-3 1 1-4-2-2 4-1Z" fill="#d8aa73" stroke-width="1.4"/>
    </g>
    <g class="echo echo-late">
      <path class="detail" d="M185 66q-4-7 2-9 7-2 7 5 0 5-5 8m12 6 5-4m-24 7-3 2"/>
      <path d="M177 52l-2-4m29 13 4-1"/>
    </g>
  </g>
</svg>