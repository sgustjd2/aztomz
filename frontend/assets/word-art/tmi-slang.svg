        Q257 108 261 111 L264 115"/>
      <path class="detail" d="M255 96 L259 91
        M261 101 L268 98"/>
    </g>

    <path class="detail" d="M56 202 Q88 200 119 202
      M211 202 Q241 200 269 202"/>
  </g>
</svg>