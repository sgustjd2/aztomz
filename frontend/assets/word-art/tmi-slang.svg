      Q159 87 144 88 Q128 88 122 70Z"/>
    <path class="detail" d="M123 71 Q142 76 162 71
      M136 88 L153 88
      M128 68 Q132 62 136 68 Q139 73 143 66
      Q146 61 150 68 Q153 73 157 67"/>
    <path d="M149 58 L166 47 M152 62 L171 52"/>
    <g class="steam detail">
      <path d="M128 58 Q123 54 128 50 Q131 47 128 44
        M140 57 Q136 53 140 49"/>
    </g>

    <path d="M183 62 Q181 50 192 48 Q205 46 207 59
      Q210 72 198 75 Q184 77 183 62Z"/>
    <path class="detail" d="M195 52 L195 61 L201 65
      M188 46 L185 43 M202 45 L205 42
      M186 77 L184 80 M204 76 L206 79"/>

    <path class="detail" d="M220 53 Q234 51 247 54
      M220 60 Q239 58 253 61
      M220 67 Q231 66 240 68
      M177 88 Q194 86 209 88
      M219 87 Q237 85 250 88
      M177 95 Q188 93 198 95
      M210 95 Q229 93 241 96"/>
    <circle cx="259" cy="116" r="3.6" class="paper"/>
    <circle cx="270" cy="125" r="2.1" class="paper"/>

    <!-- The speaker: small head, open limbs, animated gestures. -->
    <g class="talk">
      <path d="M79 151 Q75 169 72 190
        M86 153 Q82 172 79 191"/>
      <path d="M91 153 Q94 172 99 190
        M98 151 Q102 171 105 190"/>
      <path class="paper" d="M72 189 Q69 195 71 197
