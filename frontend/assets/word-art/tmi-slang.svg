<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#fdfcf8"/>
  <style>
    .ink{fill:none;stroke:#1c1c1c;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .paper{fill:#fdfcf8}
    .detail{stroke-width:.85}
    .talk{transform-box:fill-box;transform-origin:50% 100%;animation:talk 6s ease-in-out infinite}
    .listener{transform-box:fill-box;transform-origin:55% 100%;animation:recoil 6s ease-in-out infinite}
    .steam{transform-box:fill-box;transform-origin:50% 100%;animation:steam 6s ease-in-out infinite}
    @keyframes talk{
      0%,100%{transform:rotate(-1deg)}
      25%,65%{transform:rotate(1.5deg)}
      45%,80%{transform:rotate(-.5deg)}
    }
    @keyframes recoil{
      0%,100%{transform:rotate(0)}
      35%,75%{transform:rotate(4deg)}
    }
    @keyframes steam{
      0%,100%{transform:translateY(1px);opacity:.45}
      50%{transform:translateY(-3px);opacity:.9}
    }
    @media (prefers-reduced-motion: reduce){ * { animation: none !important } }
  </style>

  <g class="ink">
    <!-- A generous cloud of unnecessary detail. -->
    <path class="paper" d="M110 44
      Q114 33 132 36
      Q145 26 160 35
      Q176 28 187 37
      Q204 30 215 39
      Q236 34 244 47
      Q266 45 269 62
      Q282 74 270 87
      Q275 102 254 105
      Q238 114 222 106
      Q207 114 192 106
      Q177 113 163 105
      Q147 111 135 102
      L108 110 L118 94
      Q100 91 103 77
      Q92 63 105 56
      Q103 49 110 44Z"/>

    <!-- Lunch, its timing, and still more small details. -->
