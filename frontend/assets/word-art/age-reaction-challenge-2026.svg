<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#fdfcf8"/>
  <style>
    .ink{fill:none;stroke:#1c1c1c;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
    .paper{fill:#fdfcf8}
    .detail{stroke-width:.85}
    .react{transform-box:fill-box;transform-origin:50% 95%;animation:react 6s ease-in-out infinite}
    .sigh{transform-box:fill-box;transform-origin:50% 100%;animation:sigh 6s ease-in-out infinite}
    .steam{transform-box:fill-box;transform-origin:50% 100%;animation:steam 6s ease-in-out infinite}
    @keyframes react{
      0%,18%,72%,100%{transform:rotate(0)}
      28%,44%{transform:rotate(-7deg)}
      35%,52%{transform:rotate(4deg)}
      61%{transform:rotate(-2deg)}
    }
    @keyframes sigh{
      0%,20%,86%,100%{transform:translateY(0) rotate(0)}
      43%,65%{transform:translateY(3px) rotate(4deg)}
    }
    @keyframes steam{
      0%,100%{transform:translateY(1px) scaleX(.9);opacity:.35}
      50%{transform:translateY(-4px) scaleX(1.12);opacity:.75}
    }
    @media (prefers-reduced-motion: reduce){ * { animation: none !important } }
  </style>

  <g class="ink">
    <!-- One shared situation: a new task just before leaving. -->
    <path class="paper" d="M149 43C156 39 166 41 171 47C177 55 172 66 164 69C155 73 145 67 144 59C142 52 145 47 149 43Z"/>
    <path class="detail" d="M158 44v2m12 9h-2m-10 12v-2m-12-10h2"/>
    <path d="M158 49l.3 7.5 7.2 2"/>
    <circle cx="158.3" cy="56.5" r="1.2" fill="#1c1c1c" stroke="none"/>
    <path class="detail" d="M150 77C133 79 112 82 91 88m73-11v10m9-10c18 2 36 6 49 11" stroke-dasharray="1 4"/>

    <!-- Younger: the assignment gets an immediate, expansive reaction. -->
    <path class="paper" d="M65 156C64 168 62 181 60 190m6-34c2 12 1 23-1 34"/>
    <path class="paper" d="M80 156c3 11 7 23 12 33m-17-32c3 13 8 24 12 34"/>
    <path class="paper" d="M59 188c-4 1-6 4-6 6 5 1 10 1 14 0l-1-5m21 0c2 0 4 1 6 2l6 2c1 1 1 2 0 3-5 1-10 0-13-1"/>
    <path fill="#b66b58" d="M63 116c5-3 13-3 18 1l3 20-1 22c-8 2-16 1-23-1l2-21Z"/>
    <path class="detail" d="M64 119c4 3 10 4 15 0m-15 33c5 1 10 2 16 0"/>
    <path d="M69 112v5m5-5 1 5"/>

    <g class="react">
      <path class="paper" d="M79 121c7-3 11-9 14-16l3-14m-12 34c7-4 12-10 14-18l3-14"/>
      <path d="M96 93l-1-7m3 6 2-9m0 10 5-6m-5 8 7-2"/>
    </g>

    <path class="paper" d="M63 122c-6 4-10 10-12 17l8 4m7-17c-5 4-8 7-9 11l4 2"/>
    <path class="paper" d="M68 95c4-4 10-2 12 3 2 6-1 12-6 14-5 0-9-4-9-9 0-3 1-6 3-8Z"/>
    <path d="M65 102c-2-4-1-8 1-11l4 2 3-6 3 5 5-1c2 3 2 6 1 9"/>
    <path class="detail" d="M87 89l3-5m17 18 6-2"/>
    <g transform="rotate(-12 63 145)">
      <path class="paper" d="M54 132l17-1 1 23-18 1Z"/>
      <path d="M58 137l8-.3" stroke="#b66b58" stroke-width="2"/>
      <path class="detail" d="M58 142l9-.3m-9 4 7-.2m-7 4 9-.3"/>
    </g>
    <path d="M56 140c3-1 5 0 6 2m-6 1 5 1"/>

    <!-- Middle age: the same page, with shoulders sinking. -->
    <path class="paper" d="M147 157c0 11-1 23-2 33m6-33c1 12 0 24-1 33"/>
    <path class="paper" d="M159 157c1 11 1 22 0 33m5-34c2 13 1 25 0 35"/>
    <path class="paper" d="M144 188c-3 1-6 4-6 6 5 1 10 1 14 0l-1-5m7 0c0 2-1 4-1 6 4 1 10 1 14 0 0-2-3-4-7-5"/>
    <path class="paper" d="M143 120c6-4 14-3 20 1l4 37c-8 2-16 2-24 0l-2-22Z"/>
    <path class="detail" d="M148 122l6 6 5-6m-5 7 1 25m-8-3 3 .2"/>
    <g class="sigh">
      <path d="M150 113l-1 7m6-6 1 7"/>
      <path class="paper" d="M147 98c3-4 9-4 12 0 4 4 3 11-1 15-4 3-9 1-12-3-2-4-2-8 1-12Z"/>
      <path d="M145 103c-2-6 1-11 6-12 6-1 10 2 11 8m-17 1 4-3m7-2 5 5"/>
      <path class="paper" d="M144 123c-6 3-9 9-11 15l10 10m5-21c-5 3-7 7-8 10l7 7"/>
      <path d="M143 144c3-1 5 0 6 3m-5 0 4 2"/>
      <path class="paper" d="M163 123c5 5 6 11 5 19l-4 13m-5-29c4 5 5 9 4 15l-3 12"/>
    </g>
    <g transform="rotate(10 163 159)">
      <path class="paper" d="M155 148l17-.2 1 23-18 .3Z"/>
      <path d="M159 153h8" stroke="#b66b58" stroke-width="2"/>
      <path class="detail" d="M159 158h9m-9 4h7m-7 4h9"/>
    </g>
    <path d="M161 151c3-1 5 0 5 3m-5 0 4 1"/>

    <!-- Older: an unhurried cup of tea. -->
    <path class="paper" d="M229 157c-2 12-2 23-1 33m6-33c-2 12-2 24-1 33"/>
    <path class="paper" d="M243 157c0 11 2 22 5 33m-10-33c0 12 2 24 5 34"/>
    <path class="paper" d="M228 188c-4 1-7 4-7 6 5 1 10 1 14 0l-1-5m9 0c2 0 4 1 6 2l5 2c1 1 1 2 0 3-4 1-9 0-12-1"/>
    <path fill="#b66b58" d="M228 118c5-3 12-3 17 1l4 39c-8 2-17 2-25 0l1-21Z"/>
    <path class="detail" d="M232 120l5 7 5-7m-5 8v25m-8-3 4 .3"/>
    <path d="M233 111v7m5-7 1 7"/>
    <path class="paper" d="M231 95c4-3 9-1 11 4 2 5 0 11-4 13-5 1-9-2-10-7-1-4 0-8 3-10Z"/>
    <path class="detail" d="M227 101c-2-4-1-7 1-9m14 5 2 6m-2-10 2 2m-17 3 2 1"/>
    <path class="paper" d="M227 123c-4 7-5 15-4 23m8-21c-3 7-4 14-3 20"/>
    <g transform="rotate(-7 222 151)">
      <path class="paper" d="M213 139h17l1 23-18 .2Z"/>
      <path d="M217 144h8" stroke="#b66b58" stroke-width="2"/>
      <path class="detail" d="M217 149h9m-9 4h7m-7 4h9"/>
    </g>
    <path d="M223 144c-3-1-5 1-5 3m5 0-4 1"/>
    <path class="paper" d="M245 122c5 5 8 11 12 15l9-3m-25-8c4 6 8 12 14 16 5 0 10-2 13-4"/>
    <path class="paper" d="M262 127c3 1 8 1 12 0l-1 10c-3 2-6 2-9 0Z"/>
    <path d="M274 129c6-2 6 6 0 6"/>
    <path class="detail" d="M263 127c3-2 8-2 11 0"/>
    <g class="steam detail">
      <path d="M265 122c-4-4 3-6 0-10m6 10c-3-4 3-7 1-11"/>
    </g>

    <path class="detail" d="M44 201c17-2 39-1 60 0m24 0c16-1 32-1 48 0m33 0c18-1 37-1 63 0" opacity=".45"/>
  </g>
</svg>