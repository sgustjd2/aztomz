<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#fdfcf8"/>
  <style>
    svg{color:#1c1c1c}
    .ink{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .paper{fill:#fdfcf8}
    .detail{stroke-width:.85}
    .phone{transform-box:fill-box;transform-origin:50% 85%;animation:buzz 5.6s ease-in-out infinite}
    .bait{transform-box:fill-box;transform-origin:20% 90%;animation:beckon 6.4s ease-in-out infinite}
    .wallet{transform-box:fill-box;transform-origin:50% 0%;animation:tug 6.4s ease-in-out infinite}
    @keyframes buzz{
      0%,12%,24%,100%{transform:rotate(0)}
      15%,21%{transform:rotate(-2deg)}
      18%{transform:rotate(2deg)}
    }
    @keyframes beckon{
      0%,100%{transform:rotate(-1deg)}
      48%{transform:rotate(2deg)}
    }
    @keyframes tug{
      0%,100%{transform:translateY(0) rotate(-2deg)}
      48%{transform:translateY(-3px) rotate(2deg)}
    }
    @media (prefers-reduced-motion: reduce){ * { animation: none !important } }
  </style>
  <defs>
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".055" numOctaves="2" seed="8" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale=".45" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g class="ink" filter="url(#ink)">
    <!-- A small, faceless reader, drawn with open limbs. -->
    <path class="detail" d="M48 191q63 2 118 0m33 0q35 2 71-1" opacity=".45"/>
    <path class="paper" d="M81 163q-2 12-6 23m7-22q0 12-1 22"/>
    <path class="paper" d="M96 163q3 10 9 21m-3-22q3 10 9 21"/>
    <path class="paper" d="M75 185q-3 1-4 5q8 2 15 0l-4-5m23-2q4-1 6 1l7 5q-8 3-15 0"/>
    <path fill="#78858d" d="M80 116q8-4 17 0q7 17 6 45q-12 5-27 0q-1-24 4-45Z"/>
    <path class="detail" d="M80 153q9 3 20 0m-17-30q-2 10-1 16"/>
    <path class="paper" d="M87 106l-1 9m6-9l1 9"/>
    <path class="paper" d="M83 94q1-7 8-6q8 1 8 10q-1 10-8 11q-7-1-8-8"/>
    <path d="M82 98q-4-9 2-13q7-4 13 2l3 7q-8 0-12-5q0 7-6 9Z" fill="#1c1c1c" stroke-width="1.4"/>
    <path class="paper" d="M98 120q8 8 15 10l15-11m-32 7q9 10 17 10q4-1 17-12"/>
    <path class="paper" d="M81 122q-3 15 4 22q7 4 16-1l21-8m-35-12q-2 12 1 15q5 2 12-1l21-7"/>
    <path class="detail" d="M125 119q4-3 6-1m-11 14q5-4 8-2"/>
    <!-- The phone receives a tempting parcel message. -->
    <g class="phone">
      <path class="paper" d="M125 91q0-4 4-4l31 1q4 0 4 4l-1 65q0 4-4 4l-31-1q-4 0-4-4Z"/>
      <path class="detail" d="M129 99l30 1l-1 49l-30-1Zm8-7h13m-8 62h4"/>
      <path class="detail" d="M134 126l18 1m-18 6l13 1m-13 6h17" opacity=".55"/>
      <path class="paper" d="M133 108q0-3 3-3h17q3 0 3 3v10q0 3-3 3h-12l-5 4v-4q-3 0-3-3Z"/>
      <path class="detail" d="m135 108 9 7l10-6"/>
    </g>
    <!-- The parcel is bait: its line ends in a hook. -->
    <g class="bait">
      <path fill="#d8a18c" d="M168 53q-6 0-6 6v34q0 6 6 6h5l-9 13l24-13h39q6 0 6-6V59q0-6-6-6Z"/>
      <path class="paper" d="m181 68 15-7l17 7l-1 18l-15 7l-16-8Z"/>
      <path class="detail" d="m181 68 16 7l16-7m-16 7v18m-8-29 16 7v8l-5 2v-8"/>
      <path d="M225 86q31 10 32 33q1 13-9 20"/>
      <path d="M248 139v12q0 11-9 11q-10 0-10-10v-7l5 6"/>
      <path class="detail" d="m229 145-1 9"/>
    </g>
    <!-- A payment wallet hangs within reach of the hook. -->
    <g class="wallet">
      <path class="paper" d="m218 157 4-16q1-3 4-2l23 5q3 1 2 4l-3 16"/>
      <path class="detail" d="m223 145 25 6m-23 0 5 1m3 1 5 1"/>
      <path fill="#78858d" d="M214 158q0-4 4-4l32 3q4 0 4 4l-2 23q0 4-4 4l-32-3q-4 0-3-4Z"/>
      <path class="detail" d="m218 159 30 3m-30 18 28 3"/>
      <path class="paper" d="m245 165 10 1l-1 12l-10-1q-5-1-4-7q0-5 5-5Z"/>
      <circle cx="246" cy="171" r="1.3" fill="#1c1c1c" stroke="none"/>
    </g>
    <path class="detail" d="m111 91 4 5m-1-14 6 1m-18-4 1 6"/>
  </g>
</svg>