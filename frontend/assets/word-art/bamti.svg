<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#fdfcf8"/>
  <style>
    .ink{fill:none;stroke:#1c1c1c;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .paper{fill:#fdfcf8}
    .fine{stroke-width:.85}
    .coral{fill:#c97c69}
    .ochre{fill:#c3a35d}
    .hat{transform-box:fill-box;transform-origin:53% 85%;animation:hat 6s ease-in-out infinite}
    .bag{transform-box:fill-box;transform-origin:50% 0%;animation:bag 6s ease-in-out infinite}
    .flower{transform-box:fill-box;transform-origin:50% 100%;animation:flower 7s ease-in-out infinite}
    @keyframes hat{
      0%,100%{transform:rotate(-2deg)}
      45%{transform:rotate(2deg)}
      70%{transform:rotate(-1deg)}
    }
    @keyframes bag{
      0%,100%{transform:rotate(3deg)}
      48%{transform:rotate(-4deg)}
      76%{transform:rotate(1deg)}
    }
    @keyframes flower{
      0%,100%{transform:rotate(-3deg)}
      50%{transform:rotate(4deg)}
    }
    @media (prefers-reduced-motion: reduce){ * { animation: none !important } }
  </style>

  <g class="ink">
    <!-- A little uneven ground, with plenty of paper around it. -->
    <path class="fine" d="M62 210q37-2 67 0m10 1q31-3 51-1m10 0q32-2 57 0"/>

    <!-- A three-legged stool and a small flower vase. -->
    <path class="paper" d="M220 175q-3 17-7 33l4 1q6-17 8-32m17 0q2 17 7 31l4-1q-5-19-6-32"/>
    <path class="paper" d="M226 178q3 13 3 24l4 1q1-15-1-25"/>
    <path class="paper" d="M209 171q20-4 43-1l2 6q-22 4-46 0Z"/>
    <path class="fine" d="M215 173q14-2 30-1"/>

    <g class="flower">
      <path d="M231 153q-5-14-1-27"/>
      <path class="paper" d="M230 142q-11-9-13-4 1 7 13 7"/>
      <path class="paper" d="M230 136q7-10 11-6 0 6-11 10"/>
      <path class="coral" d="M229 125c-10 2-12-6-5-9-3-9 5-12 9-5 7-5 13 2 7 7 7 6 0 12-6 7-1 6-7 6-5 0Z"/>
      <path class="fine" d="M228 119q3-3 6 0-1 4-5 3Z"/>
    </g>
    <path class="paper" d="M224 150q7 2 14 0l-2 8q7 10 1 12-7 2-14-1-4-3 3-11Z"/>
    <path class="fine" d="M227 163q-2 3 0 4"/>

    <!-- Long, open-stroke legs and cheerfully mismatched socks. -->
    <path class="paper" d="M130 151q-5 15-6 28l-2 17h7l4-18q5-12 8-23"/>
    <path class="paper" d="M150 153q4 13 12 23l11 17 6-4-10-18q-5-11-7-22"/>
    <path class="ochre" d="M123 181l8 1-2 15-8-1Z"/>
    <path class="paper" d="M166 182l7-5 8 13-7 6Z"/>
    <path class="fine" d="M169 183l7-4m-5 8 7-4m-54 3 5 1m-6 4 5 1"/>

    <!-- One round shoe, one oversized pointed shoe. -->
    <path class="coral" d="M121 194q4 2 8 0l3 8q-1 4-11 4l-14-1q-4-4 1-6Z"/>
    <path class="paper" d="M173 192l6-4q4 6 10 8l10 4q3 3-2 4l-16-1q-5-3-8-11Z"/>
    <path class="fine" d="M108 202q11 2 22 0m50-5 4-2m-1 5 4-3m-8 6q10 2 18 0"/>

    <!-- A loose garment whose crooked hem follows the legs. -->
    <path class="paper" d="M128 116q13-4 30 0l9 38q-8 4-16 1l-9-7-7 8q-8 1-14-3Z"/>
    <path class="fine" d="M130 125q-2 16-4 25m11-26-2 22m11-22 3 23m5-24 7 27"/>
    <path d="M126 119q15 3 35-1"/>

    <!-- Bent arm, hand resting on the hip: two open edges. -->
    <path class="paper" d="M165 83q14 7 21 21 2 4-2 8l-18 15-4-5 15-16q-7-8-16-12"/>
    <path class="fine" d="M163 122q-6 0-7 3m7 0-5 3"/>

    <!-- Hanging arm and the little handbag. -->
    <path class="paper" d="M122 87q-12 12-14 28l-5 23 6 2 8-23q2-11 11-19"/>
    <g class="bag">
      <path d="M102 144q-4 4-5 13m10-12q7 3 8 13"/>
      <path class="ochre" d="M94 157q11 3 23 0l4 23q-13 6-28 0Z"/>
      <path class="fine" d="M98 163q7 2 15 0m-12 9q5 3 10-1"/>
      <path d="M104 165v4"/>
    </g>
    <path class="paper" d="M103 136q-4 5-2 9 3 3 6 0l3-6"/>

    <!-- An oversized checked shirt, patched without much concern for matching. -->
    <path class="paper" d="M134 77q-9 2-17 11l6 17 7-3-3 22q16 4 36-1l-3-23 8 3 5-15q-9-9-21-12"/>
    <path class="fine" d="M128 84l-2 13m9-16-1 40m11-41 1 43m10-41 4 38M122 90q22 4 46-1m-42 12q18 3 35 0m-33 12q15 3 33-1"/>
    <path class="coral" d="M149 99l11-2 2 13-12 1Z"/>
    <path class="fine" d="M152 101l6-1m-6 8 7-1"/>
    <path class="paper" d="M134 77l8 12-11-4Zm18-1-10 13 15-5Z"/>
    <path class="coral" d="M139 86q-14-6-15 0 1 7 15 5m6-5q12-9 15-3 3 7-15 8"/>
    <path class="ochre" d="M138 85q4-2 7 1l1 6-7 1Z"/>

    <!-- Small, faceless head and an implausibly floppy hat. -->
    <path class="paper" d="M139 68l-1 10q4 4 9 0l-1-10"/>
    <path class="paper" d="M133 53q-4 8 0 16 4 8 11 6 8-2 10-12l-2-12"/>
    <path d="M132 58q-5 8-1 13m20-12q6 7 2 13"/>
    <path class="fine" d="M130 64l-2 5m26-4 2 4"/>
    <g class="hat">
      <path class="ochre" d="M125 51q1-13 12-15 12-1 20 14l13 4q4 5-7 7-24 1-43-5-7-4 5-5Z"/>
      <path class="paper" d="M126 47q13 5 28 0l3 5q-17 4-32-1Z"/>
      <path class="fine" d="M133 39q-4 3-4 6m-7 10q21 6 41 2"/>
      <path class="coral" d="M151 48q5-7 8-4l-2 6 6 3q-4 5-10-1Z"/>
    </g>

    <!-- Tiny ink flourishes give the awkward outfit a little swagger. -->
    <path class="fine" d="M84 75l-3-5m6 2 1-7m-9 14-6-1M191 66l2-6m3 10 5-2"/>
  </g>
</svg>