<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#fdfcf8"/>
  <style>
    .ink{fill:none;stroke:#1c1c1c;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .paper{fill:#fdfcf8}
    .detail{stroke-width:.85}
    .gold{fill:#d6b36c}
    .blue{fill:#788b9b}
    .cheer{transform-box:fill-box;transform-origin:85% 90%;animation:cheer 6s ease-in-out infinite}
    .tag{transform-box:fill-box;transform-origin:50% 0%;animation:swing 6s ease-in-out infinite}
    @keyframes cheer{
      0%,35%,70%,100%{transform:rotate(0deg)}
      12%,52%{transform:rotate(-6deg)}
      23%,61%{transform:rotate(2deg)}
    }
    @keyframes swing{
      0%,100%{transform:rotate(-5deg)}
      45%{transform:rotate(7deg)}
      75%{transform:rotate(-2deg)}
    }
    @media (prefers-reduced-motion: reduce){ * { animation: none !important } }
  </style>
  <defs>
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".065" numOctaves="2" seed="8" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale=".35" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g class="ink" filter="url(#ink)">
    <!-- A little stage of paper, with plenty of air around it. -->
    <path class="detail" d="M43 199q32-2 57 0m8 1q77-3 158-1"/>

    <!-- A falling share chart; its two tiny industry symbols are drawn, not typed. -->
    <path class="paper" d="M157 65q48-2 103 0l-1 101q-48 2-103 0Z"/>
    <path class="detail" d="M170 96v55h75M171 115h73m-73 18h73" opacity=".35"/>
    <g class="detail">
      <rect class="blue" x="170" y="76" width="15" height="11" rx="1.5"/>
      <path d="M175 88v3m-5 0h15m9-13h12v11h-12Zm3-3v3m6-3v3m-6 11v3m6-3v3m-12-12h3m-3 6h3m12-6h3m-3 6h3"/>
    </g>
    <path stroke-width="2.2" d="m175 102 15 8 12-3 12 16 11-4 17 25"/>
    <path stroke-width="2.2" d="m231 141 12 4 1-13"/>
    <path class="detail" d="m175 170-5 27m74-27 6 27"/>

    <!-- One cheering figure in a lion hood. -->
    <path class="paper" d="M91 149q-3 22-5 43l8 1q8-22 11-37"/>
    <path class="paper" d="M107 153q5 18 14 38l7-3q-5-23-9-41"/>
    <path d="M85 192q-4 2-5 6 8 2 18 0l-3-5m25-2q1 6 4 7 10 0 13-3-2-4-10-6"/>
    <path class="blue" d="M91 111q12-7 24 0l8 43q-19 6-37-1Z"/>
    <path class="detail" d="M95 139q5 2 8 1m10-14 3 17"/>
    <path class="paper" d="M96 101v10q7 5 13 0v-11"/>

    <g class="cheer">
      <path class="paper" d="M92 115Q79 106 73 91l-5 3q3 18 18 30"/>
      <path class="detail" d="m68 94-3-5q-2-4 1-5l4 5q-2-7 1-7 2 1 3 7"/>
      <!-- Trophy, lifted above the lion's head. -->
      <path class="gold" d="M53 49q11-2 23 0l-2 15q-2 9-9 10-8-1-10-10Z"/>
      <path d="M53 53h-7q-1 14 12 15m18-15h7q0 13-12 15"/>
      <path d="M65 74v12m-9 3q9-6 18 0Z"/>
      <path class="detail" d="M58 53q0 9 3 12"/>
    </g>

    <path class="paper" d="M116 113q9-10 15-22l5 3q-3 15-15 27"/>
    <path class="detail" d="m131 91 1-6q1-4 3-2l-1 6q4-6 5-3l-3 8"/>
    <!-- Rounded ears and a softly scalloped mane make the hood read as a lion. -->
    <path class="gold" d="M83 76q-7-5-4-12 4-7 11-2
      8-7 17-3 7-5 13 1 6 5 2 12
      7 5 3 12 5 8-2 13
      0 9-10 10-5 7-12 2-9 4-13-4
      -9-1-8-10-7-7-1-13Z"/>
    <path class="paper" d="M91 74q8-8 18-2 8 5 7 17-1 13-11 15-11-1-15-13-3-10 1-17Z"/>
    <path class="detail" d="m84 68 3 3m29-6-2 5m-31 14 4 1m32 3 3 1m-26 16-2 4"/>
    <path class="detail" d="m46 37-4-6m19 6 1-9m17 12 6-5"/>

    <!-- A hanging markdown tag: a whole coin becomes a half coin. -->
    <g class="tag">
      <path class="detail" d="M232 157q-9 12-8 20"/>
      <path class="paper" d="m222 171-14 12 6 28 38-8-6-28Z"/>
      <circle cx="224" cy="178" r="1.7" stroke-width=".85"/>
      <g class="detail">
        <circle class="gold" cx="221" cy="191" r="4"/>
        <path d="m228 190 6-1m-2-2 2 2-1 2"/>
        <circle cx="241" cy="187" r="4" stroke-dasharray="1.2 2"/>
        <path class="gold" d="M241 183a4 4 0 0 0 0 8Z"/>
        <path d="m219 203 24-5"/>
      </g>
    </g>
  </g>
</svg>