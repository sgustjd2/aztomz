<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#fdfcf8"/>
  <style>
    .ink{fill:none;stroke:#1c1c1c;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .detail{stroke-width:.8}
    .paper{fill:#fdfcf8}
    .blue{fill:#a9c6cb}
    .red{fill:#c97d69}
    .canopy{transform-box:fill-box;transform-origin:50% 100%;animation:breeze 7s ease-in-out infinite}
    .child{transform-box:fill-box;transform-origin:50% 75%;animation:float 5s ease-in-out infinite}
    .ripple{transform-box:fill-box;transform-origin:50% 50%;animation:water 6s ease-in-out infinite}
    .late{animation-delay:-3s}
    @keyframes breeze{
      0%,100%{transform:rotate(-1deg)}
      50%{transform:rotate(1.5deg)}
    }
    @keyframes float{
      0%,100%{transform:translateY(0) rotate(-1deg)}
      50%{transform:translateY(2px) rotate(1deg)}
    }
    @keyframes water{
      0%,100%{transform:scaleX(.94);opacity:.55}
      50%{transform:scaleX(1.06);opacity:1}
    }
    @media (prefers-reduced-motion: reduce){ * { animation: none !important } }
  </style>

  <g class="ink">
    <!-- Resort elevation -->
    <path class="paper" d="M115 122 Q114 85 115 49 Q191 48 265 49 L266 139"/>
    <path d="M111 49 Q191 46 270 49 M119 44 Q192 42 263 44"/>
    <path class="detail" d="M123 54 Q191 53 258 54"/>
