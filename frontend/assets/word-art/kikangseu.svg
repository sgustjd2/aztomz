      <path d="M132 105 L151 105 L151 121 L132 121 Z M141 105 L141 121"/>
      <path d="M223 105 L242 105 L242 121 L223 121 Z M232 105 L232 121"/>
    </g>
    <path class="paper" d="M172 139 L172 113 Q187 110 202 113 L202 139"/>
    <path class="detail" d="M187 114 L187 138 M183 125 L183 128 M191 125 L191 128"/>
    <path class="red" d="M163 113 L170 102 Q187 100 204 102 L211 113 Q187 115 163 113 Z"/>
    <path class="detail" d="M176 103 L173 112 M187 102 L187 113 M198 103 L201 112"/>
    <path d="M157 140 Q209 138 275 141"/>

    <!-- Quiet pool, with generous paper around the scene -->
    <path class="paper" d="M124 149 Q155 137 215 143 Q269 147 279 171 Q290 197 237 204 Q179 213 133 197 Q102 185 106 169 Q108 157 124 149 Z"/>
    <path class="blue" stroke-width=".9" d="M130 155 Q160 145 214 150 Q259 154 270 173 Q280 191 235 197 Q178 205 137 190 Q114 181 115 170 Q116 161 130 155 Z"/>
