    <path class="detail" d="M101 106 Q107 107 113 103 M101 110 Q104 113 106 112"/>
    <path class="paper" d="M94 102 Q106 97 122 102 Q119 106 107 106 Q98 106 94 102 Z"/>
    <path class="paper" d="M101 100 L103 92 Q109 89 114 94 L116 101"/>
    <path class="detail" d="M103 97 Q109 96 114 98"/>
