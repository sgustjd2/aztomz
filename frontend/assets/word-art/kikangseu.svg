    <g class="ripple detail">
      <path d="M224 174 Q234 171 244 174 M230 179 Q237 177 243 179"/>
    </g>
    <g class="ripple late detail">
      <path d="M151 187 Q162 184 173 187 M177 194 Q188 192 199 194"/>
    </g>

    <!-- Parasol -->
    <path d="M80 90 Q79 123 80 157 M69 159 Q79 155 89 159"/>
    <g class="canopy">
      <path class="red" d="M40 91 Q53 66 79 63 Q103 65 121 91 Q110 85 101 91 Q90 85 80 91 Q69 85 59 91 Q49 86 40 91 Z"/>
      <path class="detail" d="M79 64 Q64 75 59 90 M79 64 Q80 77 80 90 M79 64 Q95 75 101 90"/>
      <path d="M79 63 L79 59"/>
    </g>

    <!-- Grandparent sitting on the pool edge -->
    <path class="paper" d="M106 149 Q111 143 118 145 L139 153 Q143 156 141 160 Q138 162 134 160 L117 155"/>
    <path class="paper" d="M112 153 Q116 162 124 169 L128 180 Q129 183 132 182 M118 151 Q121 161 130 166 L134 177"/>
