    <path class="paper" d="M102 121 Q97 131 95 143 Q95 147 98 147 M107 123 Q103 133 101 143"/>
    <path class="paper" d="M115 123 Q123 129 130 130 L142 126 M113 128 Q122 136 131 135 L143 130"/>
