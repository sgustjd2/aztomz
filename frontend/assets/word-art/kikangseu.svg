      <path class="red" d="M182 134 Q181 123 190 122 Q200 122 201 133 Q191 129 182 134 Z"/>
      <path class="detail" d="M186 126 Q191 124 196 128"/>
      <path class="red" fill-rule="evenodd" d="M174 164 C174 155 208 155 209 165 C210 177 175 178 174 164 Z M181 163 C181 168 202 169 202 163 C201 159 182 159 181 163 Z"/>
      <path class="detail" d="M178 169 Q190 174 204 168"/>
    </g>
    <path class="ripple late detail" d="M175 180 Q191 184 210 181"/>
  </g>
</svg>