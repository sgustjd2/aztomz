<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#fdfcf8"/>
  <style>
    .ink{fill:none;stroke:#1c1c1c;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .paper{fill:#fdfcf8}
    .detail{stroke-width:.85}
    .person{transform-box:fill-box;transform-origin:50% 100%;animation:fluster 5.6s ease-in-out infinite}
    .sheets{transform-box:fill-box;transform-origin:75% 70%;animation:flutter 6.4s ease-in-out infinite}
    .uproar{transform-box:fill-box;transform-origin:50% 65%;animation:clamor 4.8s ease-in-out infinite}
    @keyframes fluster{
      0%,35%,65%,100%{transform:rotate(0deg)}
      42%,54%{transform:rotate(-2deg)}
      48%,60%{transform:rotate(2deg)}
    }
    @keyframes flutter{
      0%,100%{transform:translateY(0) rotate(-3deg)}
      45%{transform:translateY(-5px) rotate(4deg)}
      72%{transform:translateY(-2px) rotate(-1deg)}
    }
    @keyframes clamor{
      0%,28%,75%,100%{opacity:.3;transform:scale(.94)}
      38%,57%{opacity:1;transform:scale(1.04)}
      47%,66%{opacity:.6;transform:scale(.98)}
    }
    @media (prefers-reduced-motion: reduce){ * { animation: none !important } }
  </style>
  <defs>
    <filter id="ink-wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".055" numOctaves="2" seed="8" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale=".45" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g class="ink" filter="url(#ink-wobble)">
    <!-- A quiet patch of paper beneath a very unquiet moment. -->
    <path class="detail" d="M52 204q43-2 78 0m13 1q66-2 116-1"/>

    <g class="person">
      <!-- Open trouser legs and small planted shoes. -->
      <path class="paper" d="M128 141q-5 17-16 30l-9 24 8 2 12-22q14-14 18-28"/>
      <path d="M128 146q-4 15-13 26l-9 20m32-42q-4 13-14 25l-12 20"/>
      <path class="paper" d="M147 145q5 12 10 22l18 27-7 5-22-27q-7-11-10-23"/>
      <path d="M146 149q5 11 10 20l16 23m-34-40q3 11 9 20l20 24"/>
      <path class="paper" d="M104 192q-4 3-10 5-4 2-3 5l20-1 3-7"/>
      <path class="paper" d="M168 193q6 0 9 4l9 2q3 1 2 4l-18-1-5-5"/>

      <!-- Two separate pen edges describe each arm. -->
      <path class="paper" d="M124 107q-12-3-21-12L87 81l-5 5 17 18q11 12 23 14"/>
      <path d="M122 108q-11-4-20-13L89 83m32 33q-12-3-21-13L85 88"/>
      <path class="paper" d="M151 108q9-12 15-25l9-20-6-3-11 20q-5 10-14 17"/>
      <path d="M150 108q10-12 17-27l7-16m-29 34q9-9 14-20l9-16"/>

      <!-- Loose sleeves and a flat, sparingly coloured coat. -->
      <path fill="#b97460" d="M124 100q12-5 24 1l9 11-10 9q2 14 8 28-15 7-34 0l4-28-10-8Z"/>
      <path class="detail" d="M136 103q-2 20-1 44m-11-17 6 1m13-1 6-1"/>
      <path d="M131 99l1-10m9 11-1-11"/>

      <!-- A small faceless head, hair and a crooked little crown. -->
      <path class="paper" d="M128 76q1-11 10-12 10 0 12 10l-1 13q-3 9-11 8-10-2-10-12"/>
      <path d="M129 79q-5-8 0-14 5-7 13-5 9 2 10 11m-22 3q7 1 13-7 2 8 8 10"/>
      <path class="paper" d="m128 62-4-12 9 5 5-12 5 11 9-6-3 14q-10-3-21 0Z"/>
      <path class="detail" d="M132 58q7-2 13 0"/>

      <!-- One announcement, and everything goes sideways. -->
      <g transform="rotate(-18 80 76)">
        <path class="paper" d="M72 58q0-3 3-3h15q3 0 3 3l-1 29q0 3-3 3H74q-3 0-3-3Z"/>
        <path class="detail" d="m75 60 14 0-1 22-13 0Z"/>
        <path fill="#b97460" stroke-width=".85" d="M78 68h7v7h-3l-3 3v-3h-2v-7Z"/>
        <path class="detail" d="M80 85h3"/>
      </g>
      <path class="paper" d="M88 83q-3-4-6-3-2 2 1 5l3 4"/>
      <path d="M169 64q-2-6 0-9m3 8 3-11m0 12 6-7m-6 11q8-1 8-5"/>
    </g>

    <!-- Loose sheets lift into the commotion. -->
    <g class="sheets">
      <path class="paper" d="m207 72 28 9-10 28-27-10q7-12 9-27Z"/>
      <path class="detail" d="m211 82 15 5m-17 1 14 5m-16 1 9 3"/>
      <path class="paper" d="m220 114 26-5q-1 15 6 26l-28 5q-5-10-4-26Z"/>
      <path class="detail" d="m226 119 14-3m-13 8 14-3m-13 8 9-2"/>
    </g>

    <!-- A startled cat: separate back, belly and open legs. -->
    <g>
      <path d="M205 182q7-10 17-7 10 1 14 9"/>
      <path d="M209 190q9 5 20 0"/>
      <path d="M208 184l-7 13m12-7-4 10m17-9 5 9m2-16 10 11"/>
      <path stroke-width="2.2" d="m199 199 4 0m3 3 4-1m19 1 4 0m9-5 4 1"/>
      <path class="paper" d="m201 183-5-6 1-12 7 5 8-4 1 11q-2 7-12 6Z"/>
      <path d="M236 183q10-7 8-16-1-6 2-9"/>
      <path class="detail" d="m195 176-6-1m7 4-6 2m24-6 5-2"/>
    </g>

    <!-- The cup has already tipped; the spill stays still. -->
    <path class="paper" d="m66 181 14-4 5 14-14 5q-4-6-5-15Z"/>
    <path d="M82 180q8-4 9 2 1 5-7 6"/>
    <path class="detail" d="M68 182q7 1 12-4"/>
    <path fill="#b97460" stroke="none" d="M69 197q-9-3-14 1-5 3 1 5 10 3 19-1 5-3-6-5Z"/>

    <!-- Uneven bursts make the sudden uproar legible without words. -->
    <g class="uproar">
      <path d="m101 61-6-9m16 4-2-11m49 0 5-9m12 38 10-5"/>
      <path class="detail" d="m62 65-8-3m8 13-10 2m43 43-9 3m106-11 7 5"/>
      <path d="m230 151 4-7m7 10 7-4"/>
      <path class="detail" d="M184 126q8 1 8 7t-7 5m-89 14q-8-1-8 4 0 4 5 3"/>
    </g>
  </g>
</svg>