<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#fdfcf8"/>
  <style>
    .ink{fill:none;stroke:#1c1c1c;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .paper{fill:#fdfcf8}
    .pink{fill:#dda5b3}
    .fine{stroke-width:.85}
    .performer{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
    .listener{transform-box:fill-box;transform-origin:50% 100%;animation:listen 6s ease-in-out infinite}
    .voice{transform-box:fill-box;transform-origin:0% 50%;animation:voice 6s ease-in-out infinite}
    @keyframes sway{
      0%,100%{transform:rotate(-1deg)}
      30%,65%{transform:rotate(1.5deg)}
      82%{transform:rotate(-.5deg)}
    }
    @keyframes listen{
      0%,100%{transform:rotate(0deg)}
      35%,65%{transform:rotate(-4deg)}
      82%{transform:rotate(1deg)}
    }
    @keyframes voice{
      0%,15%,100%{opacity:.28;transform:scale(.94)}
      35%,60%{opacity:1;transform:scale(1.04)}
      80%{opacity:.5;transform:scale(.98)}
    }
    @media (prefers-reduced-motion: reduce){ * { animation: none !important } }
  </style>

  <g class="ink">
    <!-- A small stage, drawn with a single pen. -->
    <path class="fine" d="M49 205q57-2 111 0t111-1"/>
    <path class="fine" d="M65 211q14 1 25 0m139 0 19-1"/>

    <!-- A compact speaker. -->
    <path class="paper" d="M53 171q13-2 26 0l1 31q-14 2-28 0Z"/>
    <path class="fine" d="M58 175q8-1 16 0l1 23H57Z"/>
    <path d="M71 187a6 6 0 1 1-12 0a6 6 0 1 1 12 0Z"/>
    <path class="fine" d="M64 179h3m-3 16h3"/>

    <!-- The performer: long hair, an open neckline, a little pink jacket. -->
    <g class="performer">
      <path class="paper" d="M97 77q-6-19 7-28 13-7 23 5 7 13-1 33l-8 10-22-5Z"/>
      <path class="fine" d="M102 59q-7 14-1 26m23-25q4 12-2 23"/>
      <path class="paper" d="M107 57q8-5 14 3l2 10q-1 9-7 10-8 0-10-8"/>
      <path d="m111 79-1 9m9-9 2 8"/>

      <!-- Legs are paper bands bounded by open ink strokes. -->
      <path class="paper" stroke="none" d="m103 137 9 1-3 29-3 30h-6l2-31Zm16 0 9-1 2 28 9 31-6 2-12-31Z"/>
      <path d="M103 138q-2 16-1 28l-2 30m12-57-3 28-3 29m13-57 2 27 12 30m-5-59 2 27 9 30"/>
      <path class="paper" d="M100 195q4-2 7 1l1 5q-7 3-14 1-1-3 6-7Zm33 0q4-2 7 0l7 5q-1 3-13 1Z"/>

      <path class="pink" d="M108 86q5 5 13 0l9 9-3 27 4 21q-15 4-32 0l4-22-4-24Z"/>
      <path class="fine" d="m110 89 5 8 6-8m-6 8 1 43m-11-13 6-1m10 0 5 1"/>
      <path class="paper" stroke="none" d="m102 99-6 20-3 19 5 1 6-18 4-20Z"/>
      <path d="m101 99-5 20-3 17m15-34-5 20-5 15"/>
      <path class="paper" d="M93 136q-2 6 1 9 3 1 4-3l1-5"/>

      <path class="pink" d="m126 94 8 13 8-13 6 3-10 21q-3 4-7 0l-9-14"/>
      <path class="fine" d="m140 99 6 3"/>
      <path class="paper" d="m142 95 1-8q1-3 3-1l1 5q5-2 5 1 0 4-5 6"/>

      <!-- Hand-held microphone and its loose cable. -->
      <path d="m148 88 9-13"/>
      <path fill="#1c1c1c" d="M155 75q-4-3-1-7 3-3 7 0 3 4-1 7Z"/>
      <path class="fine" d="M149 89q10 21 4 44t6 39q8 14-7 28"/>
    </g>

    <!-- Speech is pictured as changing sound, without lettering. -->
    <g class="voice">
      <path d="M171 68q8 8 0 16"/>
      <path d="M181 62q14 14 0 28"/>
      <path class="fine" d="M193 57q7 7 9 15"/>
      <path class="fine" d="M166 56l3-5m16 48 4 4"/>
    </g>

    <!-- A listener leans in, cups an ear, and catches the sound. -->
    <g class="listener">
      <path class="paper" d="M218 87q-9-5-7-15 2-12 13-12 12 0 14 11l-2 13q-6 9-14 4"/>
      <path fill="#1c1c1c" stroke="none" d="M211 74q-3-13 10-16 14-2 17 12-9 0-14-6-4 8-13 10Z"/>
      <path d="m221 89-1 9m10-10 1 9"/>

      <path class="paper" stroke="none" d="m214 143 9 1-2 24-6 29h-6l5-30Zm14 0 9-1 3 27 7 27-6 2-10-28Z"/>
      <path d="m214 144 0 24-5 28m14-51-2 23-6 29m13-52 3 25 10 27m-4-54 3 26 7 26"/>
      <path class="paper" d="M209 195q4-1 7 2l-1 5q-10 2-14-1 1-3 8-6Zm32 1q4-2 7 0l7 5q-4 3-15 0Z"/>

      <path class="paper" d="M219 96q7 3 13 0l9 8-3 43q-14 3-28-1l1-42Z"/>
      <path class="fine" d="m220 99 6 5 6-5m-16 32q8 2 16 0"/>

      <!-- The raised sleeve and open hand frame the ear. -->
      <path class="paper" d="m214 103-10 12q-3 3-6-1l-8-22 7-3 7 16 5-8"/>
      <path class="fine" d="m191 96 7-3"/>
      <path class="paper" d="m191 91-3-8q-1-5 2-5l3 7-1-12q0-3 2-2l4 16q1 3-1 4"/>
      <path class="fine" d="M202 76q-2 7 1 12"/>

      <path class="paper" stroke="none" d="m239 108 10 19-8 13-4-3 6-11-9-15Z"/>
      <path d="m239 108 10 19-8 12m-7-28 9 15-6 10"/>
      <path class="paper" d="M237 136q-5 0-5 4 2 4 7 1l2-3"/>

      <!-- A tiny pink fan badge echoes the performer's jacket. -->
      <path class="pink" d="M230 111q-3-4-5-1-2 3 5 7 7-5 4-7-2-2-4 1Z"/>
    </g>
  </g>
</svg>