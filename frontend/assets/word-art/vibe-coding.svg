<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#fdfcf8"/>
  <style>
    .ink{fill:none;stroke:#1c1c1c;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .paper{fill:#fdfcf8}
    .detail{stroke-width:.85}
    .request{transform-box:fill-box;transform-origin:50% 90%;animation:request 6s ease-in-out infinite}
    .helper{transform-box:fill-box;transform-origin:50% 80%;animation:helper 6s ease-in-out infinite}
    .spark{transform-box:fill-box;transform-origin:50% 50%;animation:spark 6s ease-in-out infinite}
    @keyframes request{
      0%,100%{transform:translateY(0) rotate(-1deg)}
      45%,60%{transform:translateY(-2px) rotate(1deg)}
    }
    @keyframes helper{
      0%,100%{transform:translateY(0) rotate(-2deg)}
      45%,60%{transform:translateY(-3px) rotate(2deg)}
    }
    @keyframes spark{
      0%,25%,100%{opacity:.4;transform:scale(.88)}
      50%,70%{opacity:1;transform:scale(1)}
    }
    @media (prefers-reduced-motion: reduce){ * { animation: none !important } }
  </style>

  <g class="ink">
    <!-- A quiet patch of floor. -->
    <path class="detail" d="M48 195q39-1 70 0m17 0q64-1 139 0"/>

    <!-- Chair, slightly bowed rather than mechanically straight. -->
    <path d="M62 121q-3 15 1 34 14 5 37 2"/>
    <path d="M68 158q-2 20-6 35m32-34 7 34"/>
    <path class="detail" d="M65 163q15 3 31-1"/>

    <!-- Relaxed legs: the hands never touch the keyboard. -->
    <path class="paper" d="M79 143q15 2 27 10l14 25-7 4-18-23-17-5"/>
    <path class="paper" d="M73 149q5 13 14 20l-3 21 7 1 7-25q-3-7-10-14"/>
    <path class="paper" d="M84 188q4 1 7 0l9 4q2 3-1 3H83q-1-3 1-7Z"/>
    <path class="paper" d="m112 179 7-3q3 6 10 8 3 3 0 4l-13-1Z"/>

    <!-- A simple muted indigo shirt. -->
    <path fill="#8c9da9" d="M78 105q-8 3-9 13l1 30q12 6 26 0l-5-29q-1-10-8-13"/>
    <path class="detail" d="M74 141q9 3 18 0"/>

    <!-- Open neck, small faceless head, a few ink hair strokes. -->
    <path d="m79 103-1 5m7-6 1 6"/>
    <path class="paper" d="M76 81q8-6 14 0 5 6 2 15-2 8-9 8-8-1-10-10-2-8 3-13Z"/>
    <path fill="#1c1c1c" stroke-width=".85" d="M73 88q-3-8 4-12 8-4 14 3l1 5q-7-4-12 0l-3 7-2-2Z"/>

    <!-- One arm rests; the other offers a spoken idea. -->
    <path class="paper" d="M73 117q-3 10 0 17l14 7m-10-24q-1 9 1 13l11 7"/>
    <path d="M87 137q6 0 7 3m-7 1q5 3 8 0"/>
    <path class="paper" d="M89 114q9 10 16 9l13-12m-25-1q8 8 11 8l11-11"/>
    <path d="M115 107q1-5 4-5m-1 9q5-1 6-5"/>
    <path class="detail" d="m119 104 4-2"/>

    <!-- A request expressed as an idea, without lettering. -->
    <g class="request">
      <path class="paper" d="M110 56q0-7 8-7l43 1q9 0 9 8v21q-1 8-10 8l-29-1-12 10 2-11q-11 0-11-8Z"/>
      <path fill="#d9b875" stroke-width="1.4" d="M132 63q0-7 7-7t7 7q0 4-4 7v4h-6v-4q-4-3-4-7Z"/>
      <path class="detail" d="M136 77h6m-14-15-4-1m15-10v-4m11 10 3-3"/>
      <path class="detail" d="M153 70q4-2 8 0m-8 6h6"/>
    </g>

    <!-- Desk and a finished little app on the laptop. -->
    <path class="paper" d="M133 151q59-2 119 0v6q-60 1-119 0Z"/>
    <path d="m141 158-4 35m105-35 5 35"/>
    <path class="paper" d="m152 109 63-1q4 0 4 4l-3 34-61 1-6-34q-1-4 3-4Z"/>
    <path class="detail" d="m155 114 58-1-3 28-51 1Z"/>
    <path fill="#8c9da9" stroke-width=".85" d="m160 119 14-1 1 18h-13Z"/>
    <path class="detail" d="m180 119 26-1m-26 6 18-1"/>
    <path fill="#d9b875" stroke-width=".85" d="M182 129h20l-1 6h-19Z"/>
    <path class="paper" d="m155 147-12 3q-2 2 2 2l77-1q4 0 1-2l-7-3"/>
    <path class="detail" d="m174 149 21-.3"/>

    <!-- A small hovering AI helper turns the idea into the app. -->
    <g class="helper">
      <path class="paper" d="M223 75q12-4 24 0l2 21q-12 6-25 1Z"/>
      <path d="m235 72 1-7"/>
      <circle cx="236" cy="63" r="2.2" fill="#d9b875" stroke-width="1.4"/>
      <path class="detail" d="M229 81q7-2 13 0v9q-6 2-13 0Z"/>
      <path class="detail" d="m233 84 2 2-2 2m5-4-2 2 2 2"/>
      <path d="M224 88q-5 1-7 8m4-11q-7 2-8 9"/>
      <path d="M247 86q6 3 6 8m-7-4q4 2 3 6"/>
      <path class="detail" d="M230 104q6 3 13 0"/>
    </g>

    <g class="spark" stroke-width="1.4">
      <path fill="#d9b875" d="m227 112 2 6 6 2-6 2-2 6-2-6-6-2 6-2Z"/>
      <path class="detail" d="m239 108 1 3 3 1-3 1-1 3-1-3-3-1 3-1Z"/>
    </g>
  </g>
</svg>