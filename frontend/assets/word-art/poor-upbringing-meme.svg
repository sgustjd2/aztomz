<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#fdfcf8"/>
  <style>
    .ink{fill:none;stroke:#1c1c1c;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .paper{fill:#fdfcf8}
    .detail{stroke-width:.85}
    .umbrella{transform-box:fill-box;transform-origin:29% 100%;animation:shelter 6s ease-in-out infinite}
    .rain{transform-box:fill-box;transform-origin:center;animation:rainfall 4s linear infinite}
    .tail{transform-box:fill-box;transform-origin:0% 100%;animation:flick 5s ease-in-out infinite}
    @keyframes shelter{
      0%,100%{transform:rotate(-1deg)}
      50%{transform:rotate(1.5deg)}
    }
    @keyframes rainfall{
      0%{transform:translate(0,-3px);opacity:.3}
      25%{opacity:.8}
      75%{opacity:.8}
      100%{transform:translate(-3px,8px);opacity:.3}
    }
    @keyframes flick{
      0%,65%,100%{transform:rotate(0deg)}
      78%{transform:rotate(-13deg)}
      88%{transform:rotate(5deg)}
    }
    @media (prefers-reduced-motion: reduce){ * { animation: none !important } }
  </style>
  <g class="ink">
    <!-- A small dry island, and someone standing just outside it. -->
    <path class="detail" d="M49 197q20-2 34 0m40 0q68 2 151-1"/>
    <path class="detail" d="M62 192c4-5 21-7 35-5 14-3 32 0 35 4 5 5-17 8-34 6-18 3-39 0-36-5Z"/>
    <path class="detail" d="M70 192q9-2 16-1m27 1 9-1"/>

    <!-- Bench. -->
    <path class="paper" d="M166 145q48-2 103 0l2 7q-53 2-106 0Z"/>
    <path d="M174 154q-1 18-3 29m5-28q1 15 0 27m82-28 4 28m-8-28q1 16 3 28"/>
    <path class="detail" d="M177 169q36 1 79-1"/>

    <!-- The cat has taken the comfortable place. -->
    <path class="tail" d="M246 135c17 0 22-9 18-17-2-5-7-4-7 0 0 4 5 5 5 9"/>
    <path class="paper" d="M204 141c-7-4-9-12-5-19 3-6 10-8 18-7l5-9 5 7 9-5 1 12c9 5 13 13 10 20-11 5-30 5-43 1Z"/>
    <path fill="#c7a56d" stroke="none" d="M205 119c5-3 11-3 14-1 2 4 0 10-5 12-7 2-12-3-9-11Z"/>
    <path d="M220 135q-5 1-8 6m12-5q-1 4-5 5"/>
    <path class="detail" d="m224 117 1-4m7 3 2-3m-5 12q3 2 5 0m-1 6 3 1"/>

    <!-- A little cup, safely sheltered too. -->
    <path class="paper" d="M179 131q6-1 12 0l-1 11q-5 3-10 0Z"/>
    <path d="M192 133c8-2 8 8-1 7"/>
    <path class="detail" d="M177 144q9 2 17 0"/>

    <!-- Wet shoes, soft knees, and a patient, bowed posture. -->
    <path class="paper" d="M91 177c-1 5-2 9-6 12-3 2-3 4 1 4l16-1q3-2-1-5l-1-9"/>
    <path class="paper" d="M116 177q1 8 7 11c5 2 6 5 2 5h-14q-3-2-3-7l-1-8"/>
    <path d="M94 132q-2 13 2 25l-5 23m10-47q0 13 1 23l-2 23"/>
    <path d="M108 133q6 13 5 23l-6 24m8-47q6 14 4 25l-3 21"/>
    <path class="paper" d="M92 99q12-3 21 7c6 9 7 20 6 31q-12 4-29-1c3-12-3-24 2-37Z"/>
    <path class="detail" d="M96 108q2 12-1 22m13-20q6 10 6 19"/>
    <path d="M99 94q1 4-1 7m7-6 1 7"/>

    <!-- Small, faceless head and rain-flattened hair. -->
    <path class="paper" d="M88 78c-1-9 5-14 12-12 8 2 11 11 8 19-2 6-8 11-13 8-5-3-7-9-7-15Z"/>
    <path d="M88 79q-5-7 1-13c6-6 14-4 18 2m-17 3q6-5 11-3"/>
    <path class="detail" d="m89 70 2 8m3-9 1 5m6-5 3 6"/>
    <path class="detail" d="M84 91q-4 5 0 6 4-1 0-6m25 2q-3 5 0 6"/>

    <!-- One arm hangs; the other reaches far beyond the shelter. -->
    <path d="M93 109q-8 12-6 23l3 16m8-37q-7 12-6 21l3 15"/>
    <path d="M90 149q0 6 4 7 4-1 1-7"/>
    <path class="paper" stroke="none" d="M111 107q11 9 22 19l31-4 3 6-35 5q-14-7-24-18Z"/>
    <path d="M111 107q12 9 22 19 15 0 31-4m-56-7q11 11 24 18 17-1 33-5"/>
    <path d="M164 122q4-5 8-3m-6 9q6-1 7-5"/>

    <!-- The umbrella is deliberately centered over the cat. -->
    <g class="umbrella">
      <path d="m169 122 26-65m0 0 3-9"/>
      <path fill="#859aab" d="M133 83c10-24 30-36 62-31 29 4 47 17 62 37-10-6-19-6-27 0-8-8-20-10-30-4-10-8-22-9-33-3-11-7-22-7-34 1Z"/>
      <path class="detail" d="M195 52q-22 7-28 30m28-30q10 12 5 33m-5-33q27 12 35 37"/>
      <path class="detail" d="m134 84-1 3m34-4-1 3m34-1-1 4m31 0-1 3m28-3 1 3"/>
    </g>

    <!-- Rain falls only on the person who keeps giving way. -->
    <g class="rain detail">
      <path d="m68 45-3 8m22-12-3 8m21-3-3 8m19 4-3 8"/>
      <path d="m58 73-3 7m20-15-3 9m-9 22-3 8m19 6-2 7"/>
      <path d="m65 128-3 8m16 8-3 8m-18 9-2 7m22 3-2 7"/>
      <path d="m119 91-2 7m11 47-2 8m9 14-2 6"/>
    </g>
    <path class="detail" d="m70 184-3-3m9 2 1-4m49 5 3-3"/>
  </g>
</svg>