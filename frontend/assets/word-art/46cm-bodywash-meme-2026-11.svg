<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#fdfcf8"/>
  <style>
    .ink{fill:none;stroke:#1c1c1c;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .fine{stroke-width:.85}
    .paper{fill:#fdfcf8}
    .water{animation:water 4.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
    .foam{animation:foam 6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 70%}
    .bubble{animation:bubble 6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
    @keyframes water{
      0%,100%{opacity:.35;transform:translateY(-2px)}
      50%{opacity:.85;transform:translateY(3px)}
    }
    @keyframes foam{
      0%,100%{transform:translateY(0) rotate(-1deg)}
      50%{transform:translateY(-1.5px) rotate(1deg)}
    }
    @keyframes bubble{
      0%,100%{transform:translateY(0);opacity:.65}
      50%{transform:translateY(-5px);opacity:1}
    }
    @media (prefers-reduced-motion: reduce){ * { animation: none !important } }
  </style>
  <g class="ink">
    <!-- Shower -->
    <path d="M72 184Q70 126 72 67Q72 43 96 43H111Q123 43 124 55"/>
    <path class="paper" d="M112 57Q123 51 134 58L138 64Q124 68 109 64Z"/>
    <path class="fine" d="M115 62l1 .2m6-.2 1 .2m6-.2 1 .2"/>
    <g class="water fine">
      <path d="M113 74l-3 8m13-7-1 9m12-10 2 8M105 94l-3 7m19-5-1 8m19-10 3 7"/>
      <path d="M98 114l-2 6m48-7 3 7"/>
    </g>

    <!-- Faceless bather -->
    <path class="paper" d="M143 78Q140 69 143 62Q146 56 153 59Q160 61 159 69Q159 78 153 81Q147 83 143 78Z"/>
    <path d="M143 65Q145 57 153 59M147 83l-1 7m9-8 1 7"/>
    <path d="M144 90Q137 93 135 106M157 90Q165 94 168 103"/>
    <!-- Arms: paired open strokes -->
    <path d="M136 99Q128 107 126 119Q135 126 148 124"/>
    <path d="M140 103Q135 111 133 116Q140 120 150 118"/>
    <path d="M166 101Q175 106 181 114Q175 123 164 126"/>
    <path d="M162 106Q169 110 173 115Q169 119 161 120"/>
    <path d="M140 113Q137 126 139 141M161 128l2 13"/>
    <!-- Foam is a complete resting pose -->
    <g class="foam paper">
      <path d="M139 104Q133 102 135 97Q137 93 142 96Q143 88 149 91Q154 86 158 92Q165 89 167 96Q174 97 170 104Q175 111 168 114Q163 119 157 115Q151 121 146 116Q137 120 135 113Q129 108 139 104Z"/>
      <path class="fine" d="M142 100q3-4 6-1m9-2q4-2 5 2m-13 10q3 3 6 0"/>
    </g>
    <!-- Small towel -->
    <path fill="#a6b7bd" d="M138 137Q150 140 164 137L166 157Q153 162 137 157Z"/>
    <path class="fine" d="M158 141l-1 15m-16-13q6 2 11 1"/>
    <!-- Legs: open strokes -->
    <path d="M141 160Q139 170 140 183M147 162Q145 174 146 183"/>
    <path d="M157 162Q159 173 158 184M163 160Q165 172 164 183"/>
    <path d="M139 185Q135 187 133 190Q139 193 149 190L147 185"/>
    <path d="M158 186l-1 5q9 2 16-1-2-3-8-5"/>

    <!-- Body-wash bottle on a low stool -->
    <path fill="#d8c39b" d="M203 172Q223 170 244 173L243 180Q223 182 203 179Z"/>
    <path d="M208 182l-2 15m31-15 3 15"/>
    <path class="paper" d="M211 133Q211 127 217 126H230Q237 127 237 134L239 169Q226 173 210 169Z"/>
    <path fill="#a6b7bd" d="M217 126v-9h12v9"/>
    <path d="M223 117v-6h18q3 0 3 4h-10"/>
    <path class="fine" d="M215 135q8-2 17 0"/>
    <!-- Tiny bare-foot emblem -->
    <path class="fine" d="M226 144Q230 143 230 147Q229 151 226 154Q224 157 224 161Q221 164 219 161Q218 158 221 155Q224 152 223 149Q222 145 226 144Z"/>
    <ellipse class="fine" cx="230.5" cy="140" rx="1.5" ry="2"/>
    <path class="fine" d="M226 140v-1m-3 3-.3-1m-2 3-.5-.7"/>
    <path class="fine" d="M214 164q8 2 19 0"/>

    <!-- A few escaping soap bubbles -->
    <g class="bubble fine paper">
      <circle cx="186" cy="99" r="4"/>
      <circle cx="195" cy="85" r="2.5"/>
      <circle cx="180" cy="74" r="1.8"/>
      <path d="M184 98q0-1 1-1m9-13 .5-.4"/>
    </g>
    <!-- Quiet ground -->
    <path class="fine" d="M80 199Q121 197 165 199m13 0q34-2 65 0"/>
    <path class="fine" d="M104 188q5-2 10 0m64-4q5-2 10 0"/>
  </g>
</svg>