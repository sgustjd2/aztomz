<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#fdfcf8"/>
  <style>
    .ink {
      fill: none;
      stroke: #1c1c1c;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .paper { fill: #fdfcf8 }
    .detail { stroke-width: .85 }
    .person {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: delight 5.6s ease-in-out infinite;
    }
    .arm {
      transform-box: fill-box;
      transform-origin: 90% 90%;
      animation: hooray 5.6s ease-in-out infinite;
    }
    .right {
      transform-origin: 10% 90%;
      animation-direction: reverse;
    }
    .spark {
      transform-box: fill-box;
      transform-origin: center;
      animation: sparkle 5.6s ease-in-out infinite;
    }
    .later { animation-delay: -.45s }
    @keyframes delight {
      0%, 24%, 58%, 100% { transform: translateY(0) rotate(0deg) }
      32% { transform: translateY(1px) rotate(-1deg) }
      40% { transform: translateY(-4px) rotate(-2deg) }
      48% { transform: translateY(-1px) rotate(1deg) }
    }
    @keyframes hooray {
      0%, 24%, 60%, 100% { transform: rotate(0deg) }
      39% { transform: rotate(-9deg) }
      48% { transform: rotate(3deg) }
    }
    @keyframes sparkle {
      0%, 22%, 66%, 100% { opacity: .35; transform: scale(.85) }
      39%, 48% { opacity: 1; transform: scale(1.08) }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important }
    }
  </style>

  <g class="ink">
    <!-- A small café corner, with a seat waiting. -->
    <path class="detail" d="M53 197 Q112 196 153 197 M170 197 Q224 198 270 196"/>

    <!-- Empty chair. -->
    <g>
      <path class="paper" d="M237 153 Q238 129 241 111 Q251 108 264 111 L262 154"/>
      <path class="detail" d="M245 117 Q252 116 259 118 M245 122 L244 145 M252 122 L251 145 M259 122 L257 145"/>
      <path class="paper" d="M227 154 Q243 152 264 154 L264 160 Q246 162 227 160 Z"/>
      <path d="M232 162 Q232 178 229 195 M259 162 Q260 177 264 195"/>
      <path class="detail" d="M233 180 Q246 182 261 180"/>
    </g>

    <!-- A little round table. -->
    <g>
      <path d="M204 149 Q203 170 205 190 M204 187 Q196 193 187 195 M205 187 Q213 193 223 195"/>
      <path class="paper" d="M167 141 Q167 134 201 134 Q234 134 236 141 L235 146 Q202 153 168 146 Z"/>
      <path class="detail" d="M169 141 Q200 148 233 141"/>
    </g>

    <!-- A slice of cake on its plate. -->
    <g>
      <ellipse class="paper" cx="202" cy="133" rx="22" ry="4"/>
      <path fill="#e5c577" d="M189 117 L211 115 L216 121 L215 132 Q204 136 190 131 Z"/>
      <path class="paper" d="M189 117 L205 110 L216 121 Q203 125 189 122 Z"/>
      <path class="detail" d="M191 127 Q203 131 214 127"/>
      <path d="M204 110 Q201 106 204 103 Q208 102 209 106 Q209 110 204 110 Z" fill="#c77c68"/>
      <path class="detail" d="M206 103 Q205 99 209 98"/>
      <path class="detail" d="M221 131 L230 125 M226 123 L232 127 M228 121 L234 125"/>
    </g>

    <!-- A faceless figure letting out a little “yes!”. -->
    <g class="person">
      <!-- Open, gently bent trouser legs. -->
      <path class="paper" stroke="none" d="M109 135 L121 137 Q117 153 108 164 L104 185 L97 184 Q97 169 101 159 Z"/>
      <path d="M109 136 Q107 151 101 159 Q97 171 97 183 M120 139 Q117 153 108 164 Q105 176 104 184"/>
      <path class="paper" stroke="none" d="M122 136 L132 136 Q133 153 136 164 L145 181 L139 185 Q128 171 127 165 Z"/>
      <path d="M123 140 Q124 153 127 165 Q131 176 138 184 M132 137 Q132 153 136 163 Q140 173 145 180"/>
      <path class="paper" d="M97 183 Q100 185 104 184 L106 190 Q99 193 90 191 Q90 187 97 183 Z"/>
      <path class="paper" d="M138 183 Q142 182 145 180 Q150 181 153 186 Q149 190 142 190 Z"/>
      <path class="detail" d="M92 189 Q99 190 105 188 M143 187 L150 185"/>

      <!-- Arms are paired open pen strokes. -->
      <g class="arm">
        <path class="paper" stroke="none" d="M108 100 Q94 94 85 82 L80 64 L86 62 L92 79 Q100 88 112 93 Z"/>
        <path d="M108 100 Q94 95 85 82 Q82 75 80 65 M112 93 Q100 88 92 79 Q88 70 86 63"/>
        <path class="paper" d="M80 65 Q76 60 78 56 Q79 54 81 58 L81 51 Q83 49 84 53 L85 58 Q89 54 90 57 Q90 61 86 64"/>
      </g>
      <g class="arm right">
        <path class="paper" stroke="none" d="M128 94 Q141 88 148 77 L151 59 L157 61 L155 81 Q148 95 132 101 Z"/>
        <path d="M128 94 Q140 88 148 77 Q150 69 151 60 M132 101 Q148 95 155 81 Q157 72 157 62"/>
        <path class="paper" d="M151 60 Q147 56 149 53 Q151 52 153 56 L153 48 Q155 46 156 50 L157 55 Q160 51 162 54 Q163 58 157 62"/>
      </g>

      <!-- A small muted-coral shirt. -->
      <path fill="#c77c68" d="M108 92 Q116 89 127 92 L134 102 L130 108 Q131 122 133 139 Q119 144 105 139 Q108 122 106 108 L102 103 Z"/>
      <path class="detail" d="M111 94 Q118 99 125 94 M109 135 Q120 138 129 135 M109 107 L112 110"/>

      <!-- Open neck and a small, unmarked head. -->
      <path class="paper" stroke="none" d="M115 83 L123 83 L125 94 Q119 97 113 93 Z"/>
      <path d="M115 83 L114 92 M123 83 Q122 88 125 93"/>
      <path class="paper" d="M113 70 Q112 61 119 60 Q127 60 128 70 L127 79 Q124 87 118 85 Q112 82 113 70 Z"/>
      <path fill="#1c1c1c" stroke-width=".85" d="M113 73 Q109 67 113 61 Q117 56 124 60 Q129 61 129 68 Q123 69 119 64 Q119 70 113 73 Z"/>
      <path class="detail" d="M114 60 Q111 56 108 59"/>
    </g>

    <!-- A few drawn bursts make the emotion readable even when still. -->
    <g class="spark">
      <path d="M66 78 L60 75 M69 69 L65 64 M78 46 L76 40"/>
    </g>
    <g class="spark later">
      <path d="M172 65 L178 60 M169 47 L172 41"/>
      <path class="detail" d="M191 86 Q192 80 194 77 Q195 83 199 85 Q194 86 193 91 Q192 87 191 86 Z"/>
    </g>
  </g>
</svg>