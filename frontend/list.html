<script src="assets/app.js?v=ref2-20261128"></script>
<script src="assets/fun.js?v=fun2-20261128"></script>
<script>
  H.boot();

  // ?type=ad | trend (기본 trend), ?cat=, ?page=  — 광고 분석은 ?label= ?ad= ?trust= ?region= ?sort= 도 받는다
  const type = (H.param('type')==='ad') ? 'ad' : 'trend';
  const PAGE_SIZE = 18;  // 3열·2열 모두 마지막 줄이 차게
  const normalizeCat = H.normalizeCategory;
  let activeCat = normalizeCat(H.param('cat'));
  let page = Math.max(1, parseInt(H.param('page')||'1', 10) || 1);

  // 최신순(수집일 desc, 동일 날짜는 분석일 desc)
  const _key = (t)=> (t.collectedAt||t.analyzedAt||'')+'~'+(t.analyzedAt||'');
  const ALL = (type==='ad'
    ? H.TRENDS.filter(t=>t.type==='신뢰분석')
    : H.TRENDS.filter(t=>t.type==='트렌드')
  ).sort((a,b)=> _key(b).localeCompare(_key(a)));

  // 헤더
  if(type==='ad'){
    document.title = '광고일까 진짜일까 — 한끗';
    H.q('#lKicker').textContent = '광고일까 진짜일까';
    H.q('#lTitle').innerHTML = 'SNS 맛집·디저트,<br><span class="hl">광고야 진짜야?</span>';
    H.q('#lDesc').textContent = '광고 의심도·후기 신뢰도를 따로 분석한 전체 목록이에요. 노출이 많다고 좋은 곳은 아니에요.';
  } else {
    document.title = '요즘 트렌드 — 한끗';
    H.q('#lKicker').textContent = '요즘 트렌드';
    H.q('#lTitle').innerHTML = '지금 뜨는 그거,<br><span class="hl">따라 해도 되나?</span>';
    H.q('#lDesc').textContent = '밈·신조어·음식·디저트·핫플을 한곳에. 카테고리로 좁혀 보세요.';
  }
  H.q('#lFresh').innerHTML = `전체 <b style="font-style:normal;color:var(--ink)">${ALL.length}</b>건`
    + (H.generatedAt ? ` · 기준일 ${H.fmtISO(H.generatedAt)}` : '');

  const cats = ['전체', ...H.NAV_CATEGORIES.map(([cat])=>cat).filter(cat=>ALL.some(t=>t.cat===cat))];
  if(!cats.includes(activeCat))activeCat='전체';

  // ---- 광고 분석 전용 필터: 판단 라벨·점수 구간·지역 태그·정렬 ----
  const band = (v, lo, hi)=>{ const n = Number(v)||0; return n < lo ? 'low' : n < hi ? 'mid' : 'high'; };
  // 지역은 tags 앞부분이 일치하면 묶는다(예: 을지로 ← 을지로3가·을지로맛집, 망원 ← 망원동·망원디저트)
  const REGIONS = ['성수','을지로','망원','압구정','강남','홍대','용산','서촌','익선동','북촌','안국','명동','문래','동대문','해방촌','논현동','서대문','신대방','노원','부산','대전','천안','남양주','하남','의정부','부평'];
  const inRegion = (t, r)=> (t.tags||[]).some(g=> String(g).startsWith(r));
  const FILTERS = [
    { key:'label', name:'판단', opts:[['good','믿고 가볼 만함'],['mid','판단 보류·취향 갈림'],['warn','주의 필요']], test:(t,v)=> (t.labelCls||'mid')===v },
    { key:'ad', name:'광고 의심', opts:[['low','낮음 0~29'],['mid','중간 30~49'],['high','높음 50+']], test:(t,v)=> band(t.ad,30,50)===v },
    { key:'trust', name:'후기 신뢰', opts:[['high','높음 60+'],['mid','중간 40~59'],['low','낮음 0~39']], test:(t,v)=> band(t.trust,40,60)===v },
    { key:'region', name:'지역', opts: REGIONS.map(r=>[r, ALL.filter(t=>inRegion(t,r)).length]).filter(([,n])=>n>0)
        .sort((a,b)=> b[1]-a[1]).map(([r,n])=>[r, r, n]), test:(t,v)=> inRegion(t,v) },
  ];
  const SORTS = [['recent','최신 분석순'],['ad','광고 의심 높은순'],['trust','후기 신뢰 높은순']];
  const recent = (a,b)=> (b.analyzedAt||'').localeCompare(a.analyzedAt||'') || _key(b).localeCompare(_key(a));
  const SORT_FN = {
    recent,
    ad: (a,b)=> (Number(b.ad)||0)-(Number(a.ad)||0) || recent(a,b),
    trust: (a,b)=> (Number(b.trust)||0)-(Number(a.trust)||0) || recent(a,b),
  };
  const f = {};  // 선택된 필터 값 (빈 값 = 전체)
  let sort = 'recent';
  function readFilters(){
    FILTERS.forEach(d=>{ const v = H.param(d.key)||''; f[d.key] = d.opts.some(([k])=>k===v) ? v : ''; });
    const s = H.param('sort'); sort = SORT_FN[s] ? s : 'recent';
  }
  if(type==='ad') readFilters();
  const activeCount = ()=> FILTERS.filter(d=>f[d.key]).length;

  const filtered = ()=>{
    let list = activeCat==='전체' ? ALL : ALL.filter(t=>t.cat===activeCat);
    if(type!=='ad') return list;
    FILTERS.forEach(d=>{ if(f[d.key]) list = list.filter(t=>d.test(t, f[d.key])); });
    return list.slice().sort(SORT_FN[sort]);
  };

  // 필터 막대: 버튼을 누르면 선택창(dialog)이 뜨고 '적용'해야 반영된다. 자주 쓰는 조건은 바로 켜는 버튼, 정렬은 칸 전환.
  const QUICK = [['label','good','믿고 가볼 만함'],['label','warn','주의 필요'],['ad','low','광고 의심 낮음'],['trust','high','후기 신뢰 높음']];
  const SORT_SHORT = { recent:'최신순', ad:'광고 의심순', trust:'후기 신뢰순' };
  // 고른 값의 짧은 이름 — 점수 구간은 '높음'만으론 어느 점수인지 모르니 이름을 붙인다
  const valueText = (d, v)=>{ const o = d.opts.find(([k])=>k===v); return (d.key==='ad'||d.key==='trust') ? `${d.name} ${o[1].split(' ')[0]}` : o[1]; };
  const countFor = (sel)=> (activeCat==='전체' ? ALL : ALL.filter(t=>t.cat===activeCat))
    .filter(t=> FILTERS.every(d=> !sel[d.key] || d.test(t, sel[d.key]))).length;

  function renderAdFilter(){
    if(type!=='ad') return;
    const host = H.q('#lFilter');
    host.innerHTML = `<div class="wf">
      <div class="wf-bar" role="group" aria-label="광고 분석 필터">
        <button type="button" class="wf-btn wf-all" data-open="" aria-haspopup="dialog">필터 전체 <span class="wf-n" hidden></span></button>
        ${FILTERS.map(d=>`<button type="button" class="wf-btn wf-drop" data-open="${d.key}" aria-haspopup="dialog"></button>`).join('')}
        <span class="wf-div" aria-hidden="true"></span>
        ${QUICK.map(([k,v,l])=>`<button type="button" class="wf-btn wf-quick" data-f="${k}" data-v="${v}" aria-pressed="false">${l}</button>`).join('')}
      </div>
      <div class="wf-sub">
        <span class="wf-count" aria-live="polite"></span>
        <button type="button" class="wf-reset" hidden>초기화</button>
        <div class="wf-sort" role="group" aria-label="정렬">${SORTS.map(([v])=>`<button type="button" data-sort="${v}" aria-pressed="false">${SORT_SHORT[v]}</button>`).join('')}</div>
      </div>
      <dialog class="wf-dialog" aria-labelledby="wfTitle">
        <div class="wf-head"><h2 id="wfTitle"></h2><button type="button" class="wf-close" aria-label="닫기"></button></div>
        <div class="wf-body"></div>
        <div class="wf-foot"><button type="button" class="wf-clear">초기화</button><button type="button" class="wf-apply"></button></div>
      </dialog>
    </div>`;
    const dlg = H.q('#lFilter .wf-dialog'), body = H.q('#lFilter .wf-body'), apply = H.q('#lFilter .wf-apply');
    let draft = {}, shown = FILTERS;
    const paint = ()=>{
      body.innerHTML = shown.map(d=>`<fieldset class="wf-group"><legend${shown.length===1?' class="wf-hide"':''}>${d.name}</legend>${d.opts.map(([v,l,n])=>
        `<button type="button" class="wf-opt" data-f="${d.key}" data-v="${H.esc(v)}" aria-pressed="${draft[d.key]===v}">${H.esc(l)}${n!=null?` <span>${n}</span>`:''}</button>`).join('')}</fieldset>`).join('');
      const n = countFor(draft); apply.textContent = n ? `${n}건 보기` : '조건에 맞는 결과 없음';
    };
    const commit = ()=>{ page = 1; render(); syncURL(); };
    body.onclick = (e)=>{
      const b = e.target.closest('.wf-opt'); if(!b) return;
      const k = b.dataset.f, v = b.dataset.v; draft[k] = draft[k]===v ? '' : v; paint();
      const again = [...body.querySelectorAll('.wf-opt')].find(x=>x.dataset.f===k && x.dataset.v===v); if(again) again.focus();
    };
    H.qa('#lFilter [data-open]').forEach(b=> b.onclick=()=>{
      shown = b.dataset.open ? FILTERS.filter(d=>d.key===b.dataset.open) : FILTERS;
      draft = Object.assign({}, f);
      H.q('#wfTitle').textContent = b.dataset.open ? shown[0].name : '필터 전체';
      paint(); dlg.showModal();
    });
    H.q('#lFilter .wf-close').onclick = ()=> dlg.close();
    dlg.onclick = (e)=>{ if(e.target===dlg) dlg.close(); };   // 바깥(어두운 부분) 누르면 닫기
    H.q('#lFilter .wf-clear').onclick = ()=>{ shown.forEach(d=> draft[d.key]=''); paint(); };
    apply.onclick = ()=>{ FILTERS.forEach(d=> f[d.key] = draft[d.key]||''); dlg.close(); commit(); };
    H.qa('#lFilter .wf-quick').forEach(b=> b.onclick=()=>{
      const k = b.dataset.f; f[k] = f[k]===b.dataset.v ? '' : b.dataset.v; commit();
    });
    H.qa('#lFilter [data-sort]').forEach(b=> b.onclick=()=>{ sort = b.dataset.sort; commit(); });
    H.q('#lFilter .wf-reset').onclick = ()=>{
      FILTERS.forEach(d=> f[d.key]=''); sort = 'recent'; activeCat = '전체'; page = 1;
      renderFilter(); render(); syncURL();
    };
  }
  // 선택 상태·건수·초기화 버튼을 현재 값에 맞춘다
  function syncAdFilter(n){
    if(type!=='ad') return;
    H.qa('#lFilter .wf-drop').forEach(b=>{
      const d = FILTERS.find(x=>x.key===b.dataset.open), v = f[d.key];
      b.classList.toggle('on', !!v); b.textContent = v ? valueText(d, v) : d.name;
      b.setAttribute('aria-label', v ? `${d.name} 필터, ${valueText(d, v)} 적용됨` : `${d.name} 필터`);
    });
    H.qa('#lFilter .wf-quick').forEach(b=>{
      const on = f[b.dataset.f]===b.dataset.v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on));
    });
    H.qa('#lFilter [data-sort]').forEach(b=> b.setAttribute('aria-pressed', String(b.dataset.sort===sort)));
    const k = activeCount(), badge = H.q('#lFilter .wf-n');
    badge.hidden = !k; badge.textContent = k;
    H.q('#lFilter .wf-count').innerHTML = `<b>${n}</b>건${n!==ALL.length?` <span>/ 전체 ${ALL.length}건</span>`:''}`;
    H.q('#lFilter .wf-reset').hidden = !(k || sort!=='recent' || activeCat!=='전체');
    H.chipRail(H.q('#lFilter .wf-bar'));
  }

  // 카테고리 필터 (트렌드·광고 분석 공용)
  function renderFilter(){
    const host = H.q('#lCatFilter'); host.hidden = false;
    host.innerHTML = cats.map(c=>{
      const n = c==='전체' ? ALL.length : ALL.filter(t=>t.cat===c).length;
      return `<button class="cat-chip${c===activeCat?' on':''}" aria-pressed="${c===activeCat}" data-cat="${H.esc(c)}">${H.esc(c)} <span class="cc-n">${n}</span></button>`;
    }).join('');
    H.chipRail(H.q('#lCatFilter'));
    H.qa('#lCatFilter .cat-chip').forEach(b=> b.onclick=()=>{
      if(activeCat===b.dataset.cat) return;
      activeCat = b.dataset.cat; page = 1;
      H.swap(()=>{ renderFilter(); render(); }); syncURL();
    });
  }

  function render(){
    const list = filtered();
    const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if(page > pages) page = pages;
    const start = (page-1) * PAGE_SIZE;
    const slice = list.slice(start, start + PAGE_SIZE);

    H.q('#lEmpty').hidden = list.length > 0;
    if(type==='ad') H.q('#lEmpty').textContent = activeCount() ? '조건에 맞는 분석이 없어요. 필터를 하나씩 풀어 보세요.' : '해당 목록이 아직 없어요.';
    syncAdFilter(list.length);
    const host = H.q('#lList');
    host.innerHTML = slice.map(H.feedRowHTML).join('');
    renderPager(pages);
  }

  // « ‹  1 2 3 4 5  › » — 번호는 지금 쪽을 가운데 둔 연속 5칸
  function renderPager(pages){
    const host = H.q('#lPager');
    if(pages <= 1){ host.innerHTML = ''; return; }
    const start = Math.max(1, Math.min(page-2, pages-4)), end = Math.min(pages, start+4);
    const arrow = (cls, to, off, label)=> `<button type="button" class="pg-nav ${cls}" data-go="${to}" ${off?'disabled':''} aria-label="${label}"></button>`;
    let html = `<span class="pg-group">${arrow('pg-first', 1, page<=1, '첫 페이지')}${arrow('pg-prev', page-1, page<=1, '이전 페이지')}</span><span class="pg-group pg-nums">`;
    for(let p=start; p<=end; p++)
      html += `<button type="button" class="pg-num${p===page?' on':''}" data-go="${p}" aria-label="${p}페이지"${p===page?' aria-current="page"':''}>${p}</button>`;
    html += `</span><span class="pg-group">${arrow('pg-next', page+1, page>=pages, '다음 페이지')}${arrow('pg-last', pages, page>=pages, '마지막 페이지')}</span>`;
    host.innerHTML = html;
    H.qa('#lPager [data-go]').forEach(b=> b.onclick=()=>{
      const p = parseInt(b.dataset.go, 10);
      if(p < 1 || p > pages || p === page) return;
      page = p; render(); syncURL();
      const top = H.q('.list-lead'); if(top) top.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start' });
    });
  }

  function syncURL(replace=false){
    const u = new URLSearchParams();
    u.set('type', type);
    if(activeCat !== '전체') u.set('cat', activeCat);
    if(page > 1) u.set('page', String(page));
    const canonical=`list.html?${u.toString()}`;  // 검색엔진에는 분류·페이지까지만 알린다
    if(type==='ad'){
      FILTERS.forEach(d=>{ if(f[d.key]) u.set(d.key, f[d.key]); });
      if(sort!=='recent') u.set('sort', sort);
    }
    const next=`list.html?${u.toString()}`;
    if(location.pathname.split('/').pop()+location.search!==next){
      history[replace?'replaceState':'pushState'](null, '', next);
    }
    H.syncMastCurrent();
    const base = type==='ad' ? '광고일까 진짜일까 — SNS 맛집·디저트 광고 분석' : (activeCat!=='전체' ? `요즘 뜨는 ${activeCat} 트렌드 모음` : '요즘 트렌드 — 밈·신조어·디저트·핫플');
    H.seo({
      title: `${base}${page>1?` (${page}페이지)`:''} | 한끗`,
      description: type==='ad'
        ? 'SNS에서 자주 보이는 맛집·디저트를 광고 의심도와 후기 신뢰도로 나눠 분석한 전체 목록. 점수는 공개 정보 기반 추정치입니다.'
        : `${activeCat!=='전체'?`요즘 유행하는 ${activeCat} `:'밈·신조어·음식·디저트·핫플 '}트렌드를 유행 단계와 출처와 함께 정리한 목록.`,
      path: canonical
    });
  }

  window.addEventListener('popstate',()=>{
    activeCat=normalizeCat(H.param('cat'));
    if(!cats.includes(activeCat))activeCat='전체';
    page=Math.max(1,parseInt(H.param('page')||'1',10)||1);
